<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Dashboard — ShubhKaPrateek</title>
<!-- Private dashboard: shubhkaprateek.com/admin. Asks for the ADMIN_PASSCODE once per device.
     Everything is read/saved through the bot (bot/admin.js): enquiries in the database, products/reels on GitHub. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #fbf6f1; --surface: #fff; --ink: #2b1f1a; --muted: #6b5a52; --line: #eadfd6; --field: #f3e8df; --accent: #d9534f; --accent-ink: #b8403c; --ok: #2e7d4f; --dark: #2b1f1a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, sans-serif; }
  a { color: var(--accent-ink); }
  .app { display: flex; flex-wrap: wrap; min-height: 100vh; }
  nav { flex: 1 1 220px; max-width: 240px; background: var(--dark); color: #f5ece6; padding: 24px 14px; display: flex; flex-direction: column; gap: 4px; }
  nav .logo { font: 700 21px Fraunces, Georgia, serif; margin: 0 10px 18px; }
  nav a { padding: 11px 12px; border-radius: 10px; color: #f5ece6; text-decoration: none; display: flex; justify-content: space-between; align-items: center; }
  nav a.on { background: var(--accent); color: #fff; font-weight: 600; }
  nav a .n { background: #fff; color: var(--accent-ink); border-radius: 999px; padding: 0 8px; font-size: 13px; font-weight: 700; }
  nav .foot { margin-top: auto; font-size: 13px; color: #c9b8ad; padding: 10px; }
  main { flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 60px; display: flex; flex-direction: column; gap: 18px; }
  @media (max-width: 760px) { nav { max-width: none; flex-direction: row; flex-wrap: wrap; padding: 12px; } nav .logo { width: 100%; margin: 0 4px 6px; } nav .foot { display: none; } }
  h1 { margin: 0; font: 700 clamp(26px, 4vw, 34px) Fraunces, Georgia, serif; }
  h2 { margin: 0 0 10px; font-size: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  button, .btn { font: inherit; font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button.main, .btn.main { background: var(--accent); border-color: transparent; color: #fff; font-weight: 700; }
  button.ok { background: var(--ok); border-color: transparent; color: #fff; font-weight: 700; }
  button.danger { color: #9b2c2c; }
  button:disabled { opacity: .5; cursor: wait; }
  .chip { padding: 7px 13px; border-radius: 999px; font-size: 14px; }
  .chip.on { background: var(--dark); color: #fff; border-color: transparent; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--field); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .s-new { background: var(--accent); color: #fff; } .s-replied { background: #e8eefc; color: #1f4fa3; } .s-hold { background: #fdf0d8; color: #8a5a00; }
  .s-confirmed { background: var(--ok); color: #fff; } .s-product { background: #efe6fb; color: #5b2ea6; } .s-live { background: #e3f3ea; color: #1f6b41; } .s-delivered { background: #1f6b41; color: #fff; } .s-declined { background: #f1ecea; color: var(--muted); }
  .list { display: grid; gap: 10px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; text-align: left; width: 100%; font-weight: 400; }
  .item:hover { border-color: var(--accent); }
  .table { width: 100%; border-collapse: collapse; }
  .tablebox { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  .table th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--field); padding: 10px 12px; white-space: nowrap; }
  .table td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
  .thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--field); display: block; }
  .cover { width: 44px; height: 70px; border-radius: 8px; object-fit: cover; background: var(--dark); display: block; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 700; }
  .steps span { padding: 5px 11px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--muted); }
  .steps span.done { background: #e3f3ea; border-color: transparent; color: #1f6b41; }
  .steps span.now { background: var(--ok); border-color: transparent; color: #fff; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; max-height: 190px; overflow: auto; padding: 4px; background: var(--field); border-radius: 10px; }
  .cats label { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; background: #fff; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; }
  .cats input { width: auto; }
  .drow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .drow .dl { flex: 1 1 200px; display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .drow input[type=checkbox] { width: auto; }
  .drow .cnt { display: flex; gap: 6px; align-items: center; } .drow .cnt input { width: 70px; }
  .drow .done { display: flex; gap: 6px; align-items: center; }
  .drow.xrow { flex-wrap: nowrap; } .drow.xrow input[data-xt] { flex: 1 1 auto; min-width: 0; }
  .sbtn { width: 34px; height: 34px; min-height: 0; padding: 0; border-radius: 8px; line-height: 1; flex: none; display: inline-grid; place-items: center; text-decoration: none; }
  .trow { position: relative; display: grid; grid-template-columns: 2fr 160px 2fr; gap: 8px; align-items: center; padding-right: 84px; }
  .trow .tb { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; }
  @media (max-width: 760px) { .trow { grid-template-columns: 1fr; border: 1px solid var(--line); border-radius: 12px; padding: 10px 84px 10px 10px; } .trow .tb { top: 10px; right: 10px; transform: none; } }
  .stats4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat b { font: 700 26px Fraunces, Georgia, serif; display: block; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat.warn b { color: #9b2c2c; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding: 8px 0 0; border-bottom: 1px solid var(--line); }
  .bars i { flex: 1 1 0; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .9; }
  .bars i.z { background: var(--line); }
  .ctree { display: grid; gap: 10px; max-height: 320px; overflow: auto; padding: 10px; background: var(--field); border-radius: 10px; }
  .ctree .grp { display: grid; gap: 6px; }
  .ctree .kids { display: flex; flex-wrap: wrap; gap: 6px; margin-left: 14px; padding-left: 12px; border-left: 2px solid var(--line); }
  .ctree label { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; background: #fff; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; width: fit-content; }
  .ctree .top { font-weight: 700; }
  .ctree input { width: auto; }
  .tree details { border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .tree details details { border: 0; border-left: 2px solid var(--line); border-radius: 0; margin: 0 0 6px 18px; }
  .tree summary { cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; list-style: none; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary::before { content: "▸"; color: var(--muted, #6b5a52); width: 12px; }
  .tree details[open] > summary::before { content: "▾"; }
  .tree summary .n { margin-left: auto; font-size: 13px; color: var(--muted, #6b5a52); font-weight: 600; }
  .tree .leaf { display: flex; gap: 10px; align-items: center; padding: 6px 14px 6px 36px; }
  @media (max-width: 760px) { .tree .leaf { padding-left: 14px; } .tree details details { margin-left: 8px; } }
  .tree .leaf b { font-weight: 500; flex: 1 1 auto; }
  .photo { width: 150px; height: 150px; border-radius: 14px; object-fit: contain; background: var(--field); border: 2px dashed #d8c6b9; display: grid; place-items: center; text-align: center; font-size: 13px; color: var(--muted); padding: 8px; }
  .split { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .split > * { flex: 1 1 320px; min-width: 0; }
  .timeline { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .hist { display: grid; gap: 2px; font-size: 14px; }
  .hist .h { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .hist .h b.d { color: var(--ink); font-size: 13px; }
  .hist .log { color: var(--muted); font-size: 13px; }
  .hist .due { color: var(--accent-ink, #b8403c); }
  .hist .late { color: #9b2c2c; font-weight: 600; }
  .hist .head { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; }
  [data-fold] > :first-child { cursor: pointer; user-select: none; position: relative; padding-right: 30px; }
  [data-fold] > :first-child::after { content: "▾"; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }
  [data-fold].closed > :first-child { margin-bottom: 0; }
  [data-fold].closed > :first-child::after { content: "▸"; }
  [data-fold].closed > :not(:first-child) { display: none !important; }
  [data-fold] .hint { font: 500 13px Inter, sans-serif; color: var(--muted); margin-left: 6px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--dark); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; max-width: 90vw; }
  .toast.on { opacity: 1; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .login { max-width: 360px; margin: 80px auto; display: grid; gap: 12px; text-align: center; padding: 0 16px; }
  .checks { display: grid; gap: 6px; max-height: 220px; overflow: auto; background: var(--field); border-radius: 10px; padding: 8px; }
  .checks label { display: flex; gap: 8px; align-items: center; font-weight: 500; }
  .checks input { width: auto; }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(async () => {
  const SITE = "https://shubhkaprateek.com";
  const $ = id => document.getElementById(id);
  const root = $("root");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toast = m => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600); };
  const saved = { get: () => { try { return localStorage.getItem("skp-admin-pass") || ""; } catch { return ""; } },
                  set: v => { try { v ? localStorage.setItem("skp-admin-pass", v) : localStorage.removeItem("skp-admin-pass"); } catch {} } };
  const login = msg => {
    root.innerHTML = `<form class="login" id="lf"><h1>Dashboard</h1><p class="muted" style="margin:0">${msg}</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Passcode" required><button class="main">Open</button></form>`;
    $("lf").onsubmit = e => { e.preventDefault(); saved.set($("pw").value.trim()); location.reload(); };
    $("pw").focus();
  };
  const PASS = saved.get();
  if (!PASS) return login("Enter your dashboard passcode");
  let BOT = "";
  try { BOT = ((await (await fetch("/data/site.json", { cache: "no-cache" })).json()).site || {}).reportApi || ""; } catch {}
  if (!BOT) { root.innerHTML = `<p class="empty">Couldn't find the bot's address (data/site.json → reportApi).</p>`; return; }

  let D = null;
  async function api(op, extra = {}) {
    const r = await fetch(BOT + "/admin/api", { method: "POST", headers: { "Content-Type": "application/json", "X-Passcode": PASS }, body: JSON.stringify({ op, ...extra }) });
    const j = await r.json().catch(() => ({ error: "No answer from the bot" }));
    if (r.status === 401) { saved.set(""); login(j.error === "no passcode set" ? "No passcode set yet — run <code>npx wrangler secret put ADMIN_PASSCODE</code> in bot/" : "Wrong passcode — try again"); throw new Error("login"); }
    if (!r.ok || j.error) { toast("⚠ " + (j.error || "Something went wrong")); throw new Error(j.error); }
    if (j.products) D = j;
    return j;
  }
  // run a save: disables the button while it works, then re-renders
  async function act(btn, fn, done) {
    if (btn) btn.disabled = true;
    try { await fn(); if (done) toast(done); render(); } catch (e) { if (btn) btn.disabled = false; }
  }

  // ---------- helpers on the data
  const STATUS = { new: "New", replied: "Replied", hold: "On hold", confirmed: "Confirmed", product: "Product added", live: "Live", delivered: "Delivered", declined: "Declined" };
  const FLOW = ["new", "replied", "confirmed", "product", "live", "delivered"];
  const today = () => new Date().toLocaleDateString("en-CA");   // YYYY-MM-DD in your time zone
  const pill = s => `<span class="pill s-${esc(s)}">${esc(STATUS[s] || s)}</span>`;
  const img = u => !u ? "" : /^https?:/.test(u) ? u : "/" + String(u).replace(/^\//, "");
  const codeOf = r => ((r.reel || "").match(/\/(?:reel|reels|p|tv)\/([A-Za-z0-9_-]+)/) || [])[1] || "";
  const flatCats = () => (D.categories || []).flatMap(c => [{ id: c.id, name: c.name }, ...(c.sub || []).map(s => ({ id: s.id, name: `${c.name} › ${s.name}` }))]);
  const catName = id => (flatCats().find(c => c.id === id) || { name: id }).name.split(" › ").pop();
  const prod = id => D.products.find(p => p.id === +id);
  const reelsOf = id => D.reels.filter(r => (r.products || []).includes(+id));
  const brandLink = name => { const b = Object.values(D.brands || {}).find(b => b.name.toLowerCase() === String(name || "").trim().toLowerCase()); return b ? b.link : ""; };
  const date = s => s ? new Date(s).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "";
  // who started it: "brand" = they reached out to us, "us" = we reached out (older ones came from the website form)
  const SOURCES = { brand: "They reached out", us: "We reached out" };
  const srcOf = e => e.source === "us" ? "us" : "brand";
  const sourceSelect = cur => `<label>Who reached out<select name="source">${Object.entries(SOURCES).map(([k, t]) => `<option value="${k}" ${k === cur ? "selected" : ""}>${t}</option>`).join("")}</select></label>`;
  // ---- deliverables: ticked from the package's list, then yours to change
  const DELIV = [
    { k: "reel", t: "Collaborative reels", re: /collaborative reel/i, count: true },
    { k: "mention", t: "Brand mention in the reel", re: /mention in the reel/i },
    { k: "stories", t: "Instagram stories", re: /instagram stor/i, count: true },
    { k: "raw", t: "Raw footage (Google Drive)", re: /raw footage/i },
    { k: "rights", t: "3-month ad usage rights", re: /usage rights/i },
    { k: "website", t: "Brand on our website", re: /addition on our website/i },
    { k: "featured", t: "Featured on website", re: /featured section/i },
    { k: "collab", t: "Added brand as collaborator", re: /collaborator/i },
    { k: "links", t: "Links changed to their product", re: /change links/i },
    { k: "repush", t: "Repushed as trial reels", re: /trial reels/i },
    { k: "refund", t: "Brand refunds the product (tick Done when refunded)", re: /refund/i },
  ];
  const delivFromPackage = name => { const items = ((D.packages || []).find(p => p.name === name) || {}).items || [];
    return { items: Object.fromEntries(DELIV.map(d => { const hit = items.find(i => d.re.test(i));
      return [d.k, { on: !!hit, done: false, ...(d.count ? { count: hit ? +((hit.match(/(\d+)/) || [])[1] || 1) : 1 } : {}) }]; })), extra: [] }; };
  const delivDefault = (e, pkg) => { const d = delivFromPackage(pkg ?? e.package); if (e.pitched === "1") d.items.reel = { on: true, done: true, count: 1 }; return d; };   // pitched: the reel is already up
  const delivOf = e => { try { const d = JSON.parse(e.deliverables || ""); if (d && d.items) return d; } catch {} return delivDefault(e); };
  const statsOf = e => { try { return JSON.parse(e.pitch_stats || "{}") || {}; } catch { return {}; } };
  const reelTitle = code => (D.reels.find(r => codeOf(r).toLowerCase() === String(code || "").toLowerCase()) || {}).title || code;
  const delivRows = d => DELIV.map(x => { const v = d.items[x.k] || { on: false, done: false, count: 1 };
      return `<div class="drow"><label class="dl"><input type="checkbox" data-on="${x.k}" ${v.on ? "checked" : ""}>${esc(x.t)}</label>
        ${x.count ? `<label class="small cnt">How many<input type="number" min="0" max="20" data-count="${x.k}" value="${esc(v.count ?? 1)}"></label>` : ""}
        <label class="small done"><input type="checkbox" data-done="${x.k}" ${v.done ? "checked" : ""}>Done</label></div>`; }).join("")
    + (d.extra || []).map(extraRow).join("");
  const extraRow = x => `<div class="drow xrow"><input data-xt value="${esc(x.t)}" placeholder="Other deliverable"><label class="small done"><input type="checkbox" data-xdone ${x.done ? "checked" : ""}>Done</label><button type="button" class="sbtn" data-xrm aria-label="Remove">✕</button></div>`;
  const readDeliv = form => JSON.stringify({
    items: Object.fromEntries(DELIV.map(x => [x.k, { on: form.querySelector(`[data-on="${x.k}"]`).checked, done: form.querySelector(`[data-done="${x.k}"]`).checked,
      ...(x.count ? { count: +form.querySelector(`[data-count="${x.k}"]`).value || 0 } : {}) }])),
    extra: [...form.querySelectorAll(".xrow")].map(r => ({ t: r.querySelector("[data-xt]").value.trim(), done: r.querySelector("[data-xdone]").checked })).filter(x => x.t) });
  const delivCount = d => { const on = DELIV.filter(x => (d.items[x.k] || {}).on), ex = d.extra || [];
    return { total: on.length + ex.length, done: on.filter(x => d.items[x.k].done).length + ex.filter(x => x.done).length }; };
  // ---- trial reels: links kept for the record only (no reel page on the website)
  const trialsOf = e => { try { const t = JSON.parse(e.trial_reels || "[]"); return Array.isArray(t) ? t : []; } catch { return []; } };
  const trialRow = t => `<div class="trow"><input data-t="link" value="${esc(t.link)}" placeholder="https://www.instagram.com/reel/…"><input data-t="date" type="date" value="${esc(t.date)}"><input data-t="note" value="${esc(t.note)}" placeholder="Note — e.g. 18% skip, low shares">
      <span class="tb">${t.link ? `<a class="btn sbtn" href="${esc(t.link)}" target="_blank" rel="noopener" aria-label="Open">↗</a>` : ""}<button type="button" class="sbtn" data-trm aria-label="Remove">✕</button></span></div>`;
  const readTrials = form => JSON.stringify([...form.querySelectorAll(".trow")].map(r => ({ link: r.querySelector('[data-t="link"]').value.trim(), date: r.querySelector('[data-t="date"]').value, note: r.querySelector('[data-t="note"]').value.trim() })).filter(t => t.link || t.note));
  const igUrl = v => !v ? "" : /^https?:/.test(v) ? v : "https://www.instagram.com/" + String(v).replace(/^@/, "").replace(/^\/+/, "") + "/";
  // ---- history: what actually happened (your dates), what's coming up, and what you did in the dashboard
  function historyOf(e, ev) {
    const day = v => String(v || "").slice(0, 10), now = today(), st = statsOf(e);
    const real = [
      ["dispatched_on", "📦 Product dispatched"], ["received_on", "📬 Product received"], ["draft_on", "📝 Draft submitted"],
      ["live_on", "🚀 Reel went live"], ["collab_on", "🤝 Collab added on Instagram"], ["paid_on", "💸 Payment received"],
    ].filter(([k]) => e[k]).map(([k, t]) => ({ d: day(e[k]), t: k === "paid_on" && e.txn_id ? `${t} · ${e.txn_id}` : t, kind: "real" }));
    if (e.pitched === "1" && st.date && (st.views || st.likes || st.shares || st.saves)) real.push({ d: day(st.date), t: `📊 Pitched at ${[st.views && st.views + " views", st.shares && st.shares + " shares", st.saves && st.saves + " saves"].filter(Boolean).join(", ") || "numbers noted"}`, kind: "real" });
    trialsOf(e).filter(t => t.date).forEach(t => real.push({ d: day(t.date), t: `🔁 Trial reel${t.note ? " — " + t.note : ""}`, kind: "real" }));
    // deadlines: upcoming, or late if the thing hasn't happened
    const dues = [["shoot_by", "🎬 Shoot by", "live_on"], ["post_by", "📅 Post by", "live_on"], ["payment_due", "⏳ Payment due", "paid_on"]]
      .filter(([k, , doneK]) => e[k] && !e[doneK] && !["delivered", "declined"].includes(e.status))
      .map(([k, t]) => ({ d: day(e[k]), t, kind: day(e[k]) < now ? "late" : "due" }));
    const logs = ev.map(x => ({ d: x.at ? new Date(x.at).toLocaleDateString("en-CA") : "", t: String(x.text).replace(/Status → (\w+)/, (m, s) => "Status → " + (STATUS[s] || s)), kind: "log" }));
    const row = x => `<div class="h"><b class="d">${date(x.d)}</b><span class="${x.kind}">${esc(x.t)}${x.kind === "late" ? " — late" : ""}${x.kind === "log" ? ` <span class="small">· logged</span>` : ""}</span></div>`;
    const ahead = dues.filter(x => x.kind === "due").sort((a, b) => a.d.localeCompare(b.d));
    const past = [...real, ...logs, ...dues.filter(x => x.kind === "late")].sort((a, b) => b.d.localeCompare(a.d) || (a.kind === "log") - (b.kind === "log"));
    return `<div class="hist">${ahead.length ? `<div class="head">Coming up</div>${ahead.map(row).join("")}<div class="head">So far</div>` : ""}${past.map(row).join("") || "—"}</div>`;
  }
  // collapsible cards on an enquiry; what you open/close is remembered on this device
  const FOLD_DEFAULT_CLOSED = ["brief", "trials", "perf", "products"];
  const foldState = () => { try { return JSON.parse(localStorage.getItem("skp-fold") || "{}"); } catch { return {}; } };
  function applyFolds() {
    const stt = foldState();
    root.querySelectorAll("[data-fold]").forEach(sec => {
      const k = sec.dataset.fold, head = sec.firstElementChild;
      const forced = (k === "products" && editing) || (k === "reel" && reelEdit);
      sec.classList.toggle("closed", !forced && (k in stt ? stt[k] : FOLD_DEFAULT_CLOSED.includes(k)));
      head.onclick = ev => { if (ev.target.closest("button, a, input, select, label")) return;
        const closed = sec.classList.toggle("closed"); const s2 = foldState(); s2[k] = closed; try { localStorage.setItem("skp-fold", JSON.stringify(s2)); } catch {} };
    });
  }
  // contacts at a brand: [{ name, role, phone }, …] (older enquiries had one "contact" line → shown as the first)
  const contactsOf = e => { try { const c = JSON.parse(e.contacts || "[]"); if (Array.isArray(c) && c.length) return c; } catch {} return e.contact ? [{ name: e.contact, role: "", phone: "" }] : []; };
  const contactRow = c => `<div class="crow" style="position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;border:1px solid var(--line,#eadfd6);border-radius:12px;padding:12px 44px 12px 12px">
      <label>Name<input data-c="name" value="${esc(c.name)}"></label>
      <label>Designation<input data-c="role" value="${esc(c.role)}" placeholder="e.g. Marketing head"></label>
      <label>Phone<input data-c="phone" type="tel" value="${esc(c.phone)}" placeholder="+91 …"></label>
      <button type="button" data-crm aria-label="Remove contact" title="Remove contact" style="position:absolute;top:8px;right:8px;width:30px;height:30px;padding:0;min-height:0;border-radius:8px;line-height:1">✕</button></div>`;
  const contactsBlock = list => `<div style="grid-column:1/-1;display:grid;gap:8px"><b class="small">Contacts</b>
      <div class="clist" style="display:grid;gap:8px">${(list.length ? list : [{}]).map(contactRow).join("")}</div>
      <div><button type="button" data-cadd>+ Add another contact</button></div></div>`;
  // reads the contact rows inside a form → JSON for the database (empty rows are dropped)
  const readContacts = form => JSON.stringify([...form.querySelectorAll(".crow")].map(r => ({ name: r.querySelector('[data-c="name"]').value.trim(), role: r.querySelector('[data-c="role"]').value.trim(), phone: r.querySelector('[data-c="phone"]').value.trim() })).filter(c => c.name || c.role || c.phone));
  const wireContacts = form => {
    form.addEventListener("click", ev => {
      if (ev.target.closest("[data-cadd]")) { form.querySelector(".clist").insertAdjacentHTML("beforeend", contactRow({})); form.querySelector(".crow:last-child input").focus(); }
      const rm = ev.target.closest("[data-crm]"); if (rm) { const rows = form.querySelectorAll(".crow"); if (rows.length > 1) rm.closest(".crow").remove(); else rm.closest(".crow").querySelectorAll("input").forEach(i => i.value = ""); }
    });
  };
  const money = v => { const n = +String(v || "").replace(/[^\d.]/g, ""); return n || 0; };

  // ---------- views
  let view = "enquiries", filter = "all", srcFilter = "all", moneyRange = "30", q = "", openId = null, editing = null, reelEdit = null;
  const go = (v, id = null) => { view = v; openId = id; editing = null; reelEdit = null; location.hash = v + (id != null ? "/" + id : ""); render(); window.scrollTo(0, 0); };
  window.addEventListener("hashchange", () => { const [v, id] = location.hash.slice(1).split("/"); if (v && v !== view + "") { view = v; openId = id || null; render(); } });

  function shell(body) {
    const n = D.enquiries.filter(e => e.status === "new").length;
    root.innerHTML = `<div class="app"><nav aria-label="Dashboard">
      <div class="logo">ShubhKaPrateek</div>
      ${[["enquiries", "Enquiries", n], ["money", "Money"], ["brands", "Brands"], ["products", "Products"], ["categories", "Categories"], ["reels", "Reels"]].map(([k, t, c]) =>
        `<a href="#${k}" data-go="${k}" class="${view === k || (view === "enquiry" && k === "enquiries") || (view === "brand" && k === "brands") ? "on" : ""}">${t}${c ? `<span class="n">${c}</span>` : ""}</a>`).join("")}
      <a href="${SITE}/" target="_blank" rel="noopener">Open website ↗</a>
      <div class="foot">Saves go live on the website in about a minute.</div></nav><main>${body}</main></div>`;
  }

  // ---- Enquiries
  function vEnquiries() {
    const list = D.enquiries.filter(e => (filter === "all" || e.status === filter) && (srcFilter === "all" || srcOf(e) === srcFilter) && (!q || (e.brand + " " + e.email).toLowerCase().includes(q)));
    const count = s => D.enquiries.filter(e => e.status === s).length;
    return `<div class="between"><h1>Enquiries</h1><div class="row"><input id="q" placeholder="Search brands…" value="${esc(q)}" style="width:220px"><button class="main" data-act="addEnq">+ Add enquiry</button></div></div>
      <div class="row">${["all", "new", "replied", "hold", "confirmed", "product", "live", "delivered", "declined"].map(s =>
        `<button class="chip ${filter === s ? "on" : ""}" data-filter="${s}">${s === "all" ? "All" : STATUS[s]} ${s === "all" ? D.enquiries.length : count(s)}</button>`).join("")}</div>
      <div class="row">${[["all", "Everyone"], ["brand", "↘ They reached out"], ["us", "↗ We reached out"]].map(([k, t]) =>
        `<button class="chip ${srcFilter === k ? "on" : ""}" data-src="${k}">${t} ${k === "all" ? D.enquiries.length : D.enquiries.filter(e => srcOf(e) === k).length}</button>`).join("")}</div>
      <div class="list">${list.map(e => `<button class="item" data-open="${e.id}">
          <span><b>${esc(e.brand)}</b> <span class="muted small">· ${esc(e.package || "—")}</span><br><span class="muted small">${e.pitched === "1" ? "🎯 Pitched a posted reel" : srcOf(e) === "us" ? "↗ We reached out" : "↘ They reached out"}${e.email ? " · " + esc(e.email) : ""} · ${date(e.created)}${e.payment_due ? ` · payment due ${date(e.payment_due)}` : ""}</span></span>
          ${pill(e.status)}</button>`).join("") || `<p class="empty">No enquiries here yet. When a brand sends the form on your media kit, it shows up here.</p>`}</div>`;
  }

  function vEnquiry() {
    const e = D.enquiries.find(x => x.id === +openId); if (!e) return `<p class="empty">That enquiry is gone. <a href="#enquiries" data-go="enquiries">Back</a></p>`;
    const at = FLOW.indexOf(e.status);
    const prods = (e.product_ids || []).map(prod).filter(Boolean);
    const ev = D.events.filter(x => x.enquiry_id === e.id);
    const reelUrl = e.reel_code ? `${SITE}/reel/${e.reel_code}` : "";
    const pk = (D.packages || []).find(p => p.name === e.package) || { price: "", payment: "" };   // the package's price + payment type, until you change them
    const mail = `mailto:${encodeURIComponent(e.email)}?subject=${encodeURIComponent("Collab with ShubhKaPrateek — " + e.brand)}&body=${encodeURIComponent(`Hi ${e.brand} team,\n\nThank you for reaching out! We'd love to work with you on ${e.package || "a collab"}.\n\n[your reply]\n\nWarm regards,\nShubhi & Prateek\n@shubhkaprateek | shubhkaprateek.com`)}`;
    return `<div class="between"><a href="#enquiries" data-go="enquiries" class="small" style="font-weight:600;text-decoration:none">← Enquiries</a>
      <span class="row small"><button type="button" data-foldall="1">Collapse all</button><button type="button" data-foldall="0">Expand all</button></span></div>
      <div class="between"><h1>${esc(e.brand)} <span class="muted" style="font:500 16px Inter,sans-serif">· ${esc(e.package || "—")}</span></h1>${pill(e.status)}</div>
      ${e.pitched === "1" ? `<p style="margin:0">🎯 Pitched from your reel ${(e.product_ids || []).length ? `<a href="${SITE}/reel/${esc(e.reel_code)}" target="_blank" rel="noopener">${esc(reelTitle(e.reel_code))}</a>` : `<b>${esc(reelTitle(e.reel_code))}</b>`} · <a href="https://www.instagram.com/reel/${esc(e.reel_code)}/" target="_blank" rel="noopener">Instagram ↗</a></p>` : ""}
      <div class="steps">${FLOW.map((s, i) => `<span class="${i < at ? "done" : i === at ? "now" : ""}">${STATUS[s]}${i < at ? " ✓" : ""}</span>`).join("")}</div>
      <div class="row">
        <a class="btn" href="${mail}">Reply by email</a>
        ${["new", "hold"].includes(e.status) ? `<button data-status="replied">Mark as replied</button>` : ""}
        ${e.status === "replied" ? `<button data-status="new">Not replied yet</button>` : ""}
        ${e.status !== "confirmed" && at < 2 ? `<button class="ok" data-status="confirmed">${e.pitched === "1" && e.reel_code ? "Confirm (reel is already live)" : "Confirm"}</button>` : ""}
        ${e.status === "live" ? `<button class="ok" data-status="delivered">Mark delivered ✓</button>` : ""}
        ${e.status === "delivered" ? `<button data-status="live">Reopen (back to Live)</button>` : ""}
        ${!["hold", "delivered"].includes(e.status) ? `<button data-status="hold">Put on hold</button>` : ""}
        ${e.status !== "declined" ? `<button class="danger" data-status="declined">Decline</button>` : `<button data-status="new">Reopen</button>`}
        <button class="danger" data-act="delEnq" style="margin-left:auto">Delete</button>
      </div>
      <div class="split">
        <section class="card" data-fold="deal"><h2>The deal</h2><form id="deal" class="grid2">
          <label>Brand<input name="brand" value="${esc(e.brand)}"></label>
          <label>Email<input name="email" value="${esc(e.email)}"></label>
          <label>Their Instagram ${e.instagram ? `<a class="small" href="${esc(igUrl(e.instagram))}" target="_blank" rel="noopener">open ↗</a>` : ""}<input name="instagram" value="${esc(e.instagram)}" placeholder="@brand or instagram.com/brand"></label>

          <label>Package<select name="package">${[...new Set([e.package || "", ...(D.packages || []).map(p => p.name)])].map(o => `<option ${o === (e.package || "") ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>
          <label>Agreed price${pk.private ? ` <span class="muted small" style="font-weight:500">— extra payment only, the refund is in Deliverables</span>` : ""}<input name="price" value="${esc(e.price || pk.price)}" placeholder="${pk.private ? "₹0 if it's only the refund" : "₹3,000"}"></label>
          <label>Payment<select name="payment">${["Paid", "Barter", "Pending"].map(o => `<option ${o === (e.payment || pk.payment) ? "selected" : ""}>${o}</option>`).join("")}</select></label>
          <label>Payment deadline<input name="payment_due" type="date" value="${esc(e.payment_due)}"></label>
          <label>Product value<input name="product_value" value="${esc(e.product_value)}" placeholder="₹4,999"></label>
          <label>Shoot by<input name="shoot_by" type="date" value="${esc(e.shoot_by)}"></label>
          <label>Post by<input name="post_by" type="date" value="${esc(e.post_by)}"></label>
          <b class="small" style="grid-column:1/-1;margin-top:4px">What actually happened</b>
          <label>Product dispatched<input name="dispatched_on" type="date" value="${esc(e.dispatched_on)}"></label>
          <label>Product received<input name="received_on" type="date" value="${esc(e.received_on)}"></label>
          <label>Draft submitted<input name="draft_on" type="date" value="${esc(e.draft_on)}"></label>
          <label>Draft link<input name="draft_link" value="${esc(e.draft_link)}" placeholder="Drive / video link"></label>
          <label>Reel went live<input name="live_on" type="date" value="${esc(e.live_on)}"></label>
          <label>Collab added on Instagram<input name="collab_on" type="date" value="${esc(e.collab_on)}"></label>
          <label>Payment received<input name="paid_on" type="date" value="${esc(e.paid_on)}"></label>
          <div data-paidbox style="grid-column:1/-1;display:${e.paid_on || e.txn_id || e.payment_notes ? "grid" : "none"};gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px">
            <b class="small" style="grid-column:1/-1">💸 Payment details</b>
            <label>Transaction ID<input name="txn_id" value="${esc(e.txn_id)}" placeholder="UPI / bank ref"></label>
            <label>Other details<textarea name="payment_notes" rows="2" placeholder="Paid to which account, invoice no., TDS…">${esc(e.payment_notes)}</textarea></label></div>
          ${contactsBlock(contactsOf(e))}
          <label>Their product link<input name="product_link" value="${esc(e.product_link)}"></label>
          <label style="grid-column:1/-1">Their message<textarea name="message" rows="2">${esc(e.message)}</textarea></label>
          <label style="grid-column:1/-1">Your notes<textarea name="notes" rows="2">${esc(e.notes)}</textarea></label>
          <div><button class="main">Save deal</button></div></form></section>
        <section class="card" data-fold="history"><h2>History</h2>${historyOf(e, ev)}</section>
      </div>
      ${e.pitched === "1" ? (() => { const st = statsOf(e); return `<section class="card" data-fold="perf"><h2>Performance when pitched</h2>
        <form id="pst" class="grid2">${[["views", "Views"], ["likes", "Likes"], ["comments", "Comments"], ["shares", "Shares"], ["saves", "Saves"]].map(([k, t]) =>
          `<label>${t}<input name="${k}" inputmode="numeric" value="${esc(st[k])}" placeholder="${k === "views" ? "e.g. 2.4M" : ""}"></label>`).join("")}
          <label>As on<input name="date" type="date" value="${esc(st.date || today())}"></label>
          <div><button class="main">Save numbers</button></div></form></section>`; })() : ""}
      ${(() => { const d = delivOf(e), c = delivCount(d); return `<section class="card" data-fold="deliv"><div class="between"><h2>Deliverables</h2><span class="pill ${c.total && c.done === c.total ? "s-live" : ""}">${c.done} / ${c.total} done</span></div>
        <form id="dlv"><div class="dlist">${delivRows(d)}</div>
          <div class="row" style="margin-top:12px"><button class="main">Save deliverables</button><button type="button" data-xadd>+ Add another</button><button type="button" data-dreset>Reset to package</button></div></form>
        <p class="muted small" style="margin:8px 0 0">Ticked from ${e.package ? esc(e.package) : "the package"} — untick, add or change the story count as you agree with the brand.</p></section>`; })()}
      <section class="card" data-fold="brief"><h2>Reel brief<span class="hint">${[e.non_negotiables && "non-negotiables", e.script && "script"].filter(Boolean).join(" + ") || "empty"}</span></h2><form id="brief" style="display:grid;gap:12px">
          <label>Brand's non-negotiables<textarea name="non_negotiables" rows="4" placeholder="One per line — e.g.&#10;Show the logo in the first 3 seconds&#10;Say “use code SKP10”&#10;Tag @brand in the caption">${esc(e.non_negotiables)}</textarea></label>
          <label>Script<textarea name="script" rows="8" placeholder="Hook…&#10;Scene 1…">${esc(e.script)}</textarea></label>
          <div><button class="main">Save brief</button></div></form></section>
      <section class="card" data-fold="products"><div class="between"><h2>Their products<span class="hint">${prods.length}</span></h2><button data-act="newProd">+ Add product</button></div>
        ${prods.length ? `<div class="list">${prods.map(p => `<div class="row"><img class="thumb" onerror="this.style.visibility='hidden'" src="${esc(img(p.variants[0]?.image))}" alt="" referrerpolicy="no-referrer"><b>${esc(p.name)}</b><span class="muted small">${(p.category || []).map(catName).map(esc).join(" · ")}</span><button data-edit="${p.id}">Edit</button></div>`).join("")}</div>` : `<p class="muted" style="margin:0">Confirm the collab, then add the product they're sending: paste its link and the photo, name and categories fill in.</p>`}
        ${editing ? productForm(e) : ""}
      </section>
      <section class="card" data-fold="reel"><h2>Reel</h2>
        ${e.reel_code ? `<p style="margin:0 0 10px">${e.pitched === "1" && !["live", "delivered"].includes(e.status) ? "Your reel" : "Live"}: <a href="${reelUrl}" target="_blank" rel="noopener">${reelUrl}</a> · brand page: ${brandLink(e.brand) ? `<a href="${esc(brandLink(e.brand))}" target="_blank" rel="noopener">${esc(brandLink(e.brand))}</a>` : "—"}</p>` : ""}
        ${prods.length ? `<form id="reelf" class="row" style="align-items:end"><input name="link" placeholder="https://www.instagram.com/reel/…" value="${e.reel_code ? "https://www.instagram.com/reel/" + esc(e.reel_code) + "/" : ""}" style="flex:1 1 280px"><label class="small" style="flex:0 1 170px">Live date<input name="live_on" type="date" value="${esc(e.live_on || today())}"></label><button class="main">${e.reel_code ? "Update reel" : "Go live →"}</button></form>
          <p class="muted small" style="margin:8px 0 0">Makes the reel page, connects it to their product${prods.length > 1 ? "s" : ""} and publishes the website. Status → Live.</p>` : `<p class="muted" style="margin:0">Add their product first.</p>`}
      </section>
      <section class="card" data-fold="trials"><h2>Trial reels <span class="hint">${trialsOf(e).length || ""}</span><span class="muted small" style="font-weight:500">· just for your record, no page on the website</span></h2>

          <div class="row"><button class="main">Save trial reels</button><button type="button" data-tadd>+ Add trial reel</button></div></form>
      </section>`;
  }

  // the product form (used inside an enquiry and on the Products page)

    const f = editing.form || { name: p ? p.name : "", brand: p ? p.brand || "" : (e ? e.brand : ""), link: v.link || (e ? e.product_link : "") || "", image: v.image || "", category: p ? [].concat(p.category || []) : [] };

          ${editing.photo || f.image ? `<img class="photo" src="${esc(editing.photo || img(f.image))}" alt="Product photo" referrerpolicy="no-referrer">` : `<div class="photo">Photo appears here after "Fetch details" — or upload one</div>`}
          <label class="btn" style="justify-content:center">Upload photo<input id="up" type="file" accept="image/*" hidden></label>

          <label>Brand<input name="brand" value="${esc(f.brand)}" placeholder="e.g. Deciwood"></label>

            return `<div class="grp">${box(c, "top")}${(c.sub || []).length ? `<div class="kids">${c.sub.map(x => box(x)).join("")}</div>` : ""}</div>`; }).join("")}</div></div>

  // ---- Products
  function vProducts() {
    const list = D.products.filter(p => !q || (p.name + " " + (p.brand || "") + " " + (p.category || []).map(catName).join(" ")).toLowerCase().includes(q));
    const fav = D.featured.map(Number);
    return `<div class="between"><h1>Products <span class="muted" style="font:500 16px Inter,sans-serif">${D.products.length}</span></h1>
        <div class="row"><input id="q" placeholder="Search products, brands, categories…" value="${esc(q)}" style="width:260px"><button class="main" data-act="newProd">+ New product</button></div></div>
      ${editing ? productForm(null) : ""}
      <div class="tablebox"><table class="table"><thead><tr><th></th><th>Product</th><th>Brand</th><th>Categories</th><th>Reels</th><th>Featured</th><th></th></tr></thead><tbody>
      ${list.map(p => `<tr><td><img class="thumb" onerror="this.style.visibility='hidden'" src="${esc(img(p.variants[0]?.image))}" alt="" loading="lazy" referrerpolicy="no-referrer"></td>
        <td><b>${esc(p.name)}</b><br><span class="muted small">#${p.id}</span></td>
        <td>${p.brand ? esc(p.brand) : `<span class="muted small">—</span>`}</td>
        <td class="small">${(p.category || []).map(catName).map(esc).join(" · ") || "—"}</td>
        <td>${reelsOf(p.id).length}</td>
        <td><button class="chip ${fav.includes(p.id) ? "on" : ""}" data-fav="${p.id}" aria-label="Featured">${fav.includes(p.id) ? "★" : "☆"}</button></td>
        <td><div class="row" style="flex-wrap:nowrap"><button data-edit="${p.id}">Edit</button><a class="btn" href="${SITE}/product/${p.id}" target="_blank" rel="noopener">View ↗</a></div></td></tr>`).join("")}
      </tbody></table></div>`;
  }

  // ---- Reels
  function vReels() {
    const list = D.reels.filter(r => !q || (r.title + " " + codeOf(r)).toLowerCase().includes(q)).slice().reverse();
    return `<div class="between"><h1>Reels <span class="muted" style="font:500 16px Inter,sans-serif">${D.reels.length}</span></h1>
        <div class="row"><input id="q" placeholder="Search reels…" value="${esc(q)}" style="width:220px"><button class="main" data-act="newReel">+ New reel</button></div></div>
      ${reelEdit ? reelForm() : ""}
      <div class="tablebox"><table class="table"><thead><tr><th></th><th>Reel</th><th>Products</th><th></th></tr></thead><tbody>
      ${list.map(r => `<tr><td><img class="cover" src="/assets/covers/${esc(codeOf(r))}.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></td>
        <td><b>${esc(r.title)}</b><br><span class="muted small">${esc(codeOf(r))}</span></td>
        <td class="small">${(r.products || []).map(prod).filter(Boolean).map(p => esc(p.name)).join(", ")}</td>
        <td><div class="row" style="flex-wrap:nowrap"><button data-reel="${esc(codeOf(r))}">Edit</button><button data-pitch="${esc(codeOf(r))}" title="Start a brand deal from this reel">🎯 Pitch</button><a class="btn" href="${SITE}/reel/${esc(codeOf(r))}" target="_blank" rel="noopener">View ↗</a></div></td></tr>`).join("")}
      </tbody></table></div>`;
  }
  function reelForm() {
    const r = reelEdit.code ? D.reels.find(x => codeOf(x) === reelEdit.code) : null;
    const chosen = new Set(r ? r.products : []);
    return `<form id="rf" class="card" style="background:var(--bg)"><h2>${r ? "Edit reel" : "New reel"}</h2>
      <div class="grid2"><label>Reel link<input name="link" value="${r ? esc(r.reel) : ""}" placeholder="https://www.instagram.com/reel/…" ${r ? "readonly" : ""}></label>
        <label>Title (optional — read from Instagram)<input name="title" value="${r ? esc(r.title) : ""}"></label></div>
      <div style="margin-top:12px"><b class="small">Products in this reel</b><div class="checks">${D.products.slice().reverse().map(p => `<label><input type="checkbox" name="p" value="${p.id}" ${chosen.has(p.id) ? "checked" : ""}>${esc(p.name)} <span class="muted small">#${p.id}</span></label>`).join("")}</div></div>
      <div class="row" style="margin-top:12px"><button class="main">${r ? "Save reel" : "Go live →"}</button><button type="button" data-act="cancelEdit">Cancel</button>
        ${r ? `<button type="button" class="danger" data-delreel="${esc(reelEdit.code)}" style="margin-left:auto">Delete reel</button>` : ""}</div></form>`;
  }

  // ---- Brands
  function brandList() {
    const map = new Map();
    const add = (name, k, x) => { const key = String(name || "").trim().toLowerCase(); if (!key) return; if (!map.has(key)) map.set(key, { name: String(name).trim(), products: [], enquiries: [] }); map.get(key)[k].push(x); };
    D.products.forEach(p => add(p.brand, "products", p));
    D.enquiries.forEach(e => add(e.brand, "enquiries", e));
    return [...map.values()].sort((a, b) => (b.enquiries.length + b.products.length) - (a.enquiries.length + a.products.length));
  }
  // ---- Money: received by day (Payment received date), and what's still due
  function vMoney() {
    const rs = n => "₹" + Math.round(n).toLocaleString("en-IN");
    const agreed = D.enquiries.filter(e => ["confirmed", "product", "live", "delivered"].includes(e.status) && e.payment !== "Barter" && money(e.price) > 0);
    const got = agreed.filter(e => e.paid_on), due = agreed.filter(e => !e.paid_on), now = today();
    const late = due.filter(e => e.payment_due && e.payment_due < now);
    const from = moneyRange === "all" ? "" : moneyRange === "month" ? now.slice(0, 8) + "01" : new Date(Date.now() - 29 * 864e5).toLocaleDateString("en-CA");
    const inRange = got.filter(e => !from || e.paid_on >= from);
    const sum = l => l.reduce((t, e) => t + money(e.price), 0);
    // per day
    const byDay = {}; inRange.forEach(e => (byDay[e.paid_on] = byDay[e.paid_on] || []).push(e));
    const days = Object.keys(byDay).sort().reverse();
    const chartDays = [...Array(30)].map((_, i) => new Date(Date.now() - (29 - i) * 864e5).toLocaleDateString("en-CA"));
    const perDay = d => sum(got.filter(e => e.paid_on === d)), top = Math.max(1, ...chartDays.map(perDay));
    const dueRow = e => `<button class="item" data-open="${e.id}"><span><b>${esc(e.brand)}</b> <span class="muted small">· ${esc(e.package || "—")}</span><br>
        <span class="small ${e.payment_due && e.payment_due < now ? "" : "muted"}" style="${e.payment_due && e.payment_due < now ? "color:#9b2c2c;font-weight:600" : ""}">${e.payment_due ? (e.payment_due < now ? "Late — was due " : "Due ") + date(e.payment_due) : "No deadline set"}</span></span><b>${rs(money(e.price))}</b></button>`;
    return `<div class="between"><h1>Money</h1><div class="row">${[["30", "Last 30 days"], ["month", "This month"], ["all", "All time"]].map(([k, t]) => `<button class="chip ${moneyRange === k ? "on" : ""}" data-mrange="${k}">${t}</button>`).join("")}</div></div>
      <div class="stats4">
        <div class="stat"><b>${rs(sum(inRange))}</b><span>Received${moneyRange === "all" ? "" : moneyRange === "month" ? " this month" : " in 30 days"} · ${inRange.length} deal${inRange.length === 1 ? "" : "s"}</span></div>
        <div class="stat"><b>${rs(sum(due))}</b><span>Still due · ${due.length} deal${due.length === 1 ? "" : "s"}</span></div>
        <div class="stat ${late.length ? "warn" : ""}"><b>${rs(sum(late))}</b><span>Late (past deadline) · ${late.length}</span></div>
        <div class="stat"><b>${rs(sum(got))}</b><span>Received all time</span></div>
      </div>
      <section class="card"><h2>Received per day <span class="muted small" style="font-weight:500">· last 30 days</span></h2>
        <div class="bars" role="img" aria-label="Money received per day, last 30 days">${chartDays.map(d => { const v = perDay(d); return `<i class="${v ? "" : "z"}" style="height:${v ? Math.max(6, v / top * 100) : 2}%" title="${date(d)}: ${rs(v)}"></i>`; }).join("")}</div>
        <div class="between small muted" style="margin-top:4px"><span>${date(chartDays[0])}</span><span>Today</span></div></section>
      <div class="split">
        <section class="card"><h2>Day by day</h2>
          ${days.map(d => `<div class="between" style="padding:8px 0;border-bottom:1px dashed var(--line)"><span><b>${date(d)}</b><br><span class="muted small">${byDay[d].map(e => esc(e.brand) + (e.txn_id ? " · " + esc(e.txn_id) : "")).join(" · ")}</span></span><b>${rs(sum(byDay[d]))}</b></div>`).join("") || `<p class="muted" style="margin:0">Nothing received in this range. A deal counts here once you fill its <b>Payment received</b> date.</p>`}</section>
        <section class="card"><h2>Still due</h2><div class="list">${due.sort((a, b) => (a.payment_due || "9999").localeCompare(b.payment_due || "9999")).map(dueRow).join("") || `<p class="muted" style="margin:0">Nothing due 🎉</p>`}</div></section>
      </div>
      <p class="muted small" style="margin:0">Counts confirmed, live and delivered deals with an agreed price (barter excluded). Received = has a Payment received date; due = doesn't yet.</p>`;
  }

  // ---- Categories: tab → sub-category → products
  function vCategories() {
    const has = (p, id) => (p.category || []).includes(id);
    const match = p => !q || (p.name + " " + (p.brand || "")).toLowerCase().includes(q);
    const leaf = p => `<div class="leaf"><img class="thumb" onerror="this.style.visibility='hidden'" src="${esc(img(p.variants[0]?.image))}" alt="" referrerpolicy="no-referrer"><b>${esc(p.name)}</b><span class="muted small">${esc(p.brand || "")}</span><button data-editp="${p.id}">Edit</button></div>`;
    const none = `<p class="muted small" style="margin:0;padding:6px 14px 10px 40px">No products yet</p>`;
    const tree = (D.categories || []).map(c => {
      const subs = c.sub || [], ids = [c.id, ...subs.map(x => x.id)];
      const all = D.products.filter(p => ids.some(id => has(p, id)) && match(p));
      const direct = all.filter(p => !subs.some(x => has(p, x.id)));   // in the tab but in none of its sub-categories
      if (q && !all.length) return "";
      return `<details ${q ? "open" : ""}><summary><b>${esc(c.emoji || "")} ${esc(c.name)}</b>${c.theme ? `<span class="muted small">theme</span>` : ""}<span class="n">${all.length}</span></summary>
        ${subs.map(x => { const ps = all.filter(p => has(p, x.id)); return q && !ps.length ? "" : `<details ${q ? "open" : ""}><summary>${esc(x.name)}<span class="n">${ps.length}</span></summary>${ps.map(leaf).join("") || none}</details>`; }).join("")}
        ${direct.length ? (subs.length ? `<details ${q ? "open" : ""}><summary class="muted">No sub-category<span class="n">${direct.length}</span></summary>${direct.map(leaf).join("")}</details>` : direct.map(leaf).join("")) : (!subs.length ? none : "")}
      </details>`;
    }).join("");
    const known = new Set(flatCats().map(c => c.id));
    const orphans = D.products.filter(p => !(p.category || []).some(id => known.has(id)) && match(p));
    return `<div class="between"><h1>Categories</h1><input id="q" placeholder="Search products…" value="${esc(q)}" style="width:240px"></div>
      <p class="muted" style="margin:0">Tap a category to open it. Change a product's categories from its Edit.</p>
      <div class="tree" style="display:grid;gap:10px">${tree || `<p class="empty">Nothing matches.</p>`}
      ${orphans.length ? `<details open><summary><b>⚠️ Not in any category</b><span class="n">${orphans.length}</span></summary>${orphans.map(leaf).join("")}</details>` : ""}</div>`;
  }

  function vBrands() {
    const list = brandList().filter(b => !q || b.name.toLowerCase().includes(q));
    return `<div class="between"><h1>Brands <span class="muted" style="font:500 16px Inter,sans-serif">${list.length}</span></h1><input id="q" placeholder="Search brands…" value="${esc(q)}" style="width:220px"></div>
      <div class="tablebox"><table class="table"><thead><tr><th>Brand</th><th>Collabs</th><th>Products</th><th>Paid deals</th><th>Brand page</th></tr></thead><tbody>
      ${list.map(b => `<tr style="cursor:pointer" data-brand="${esc(b.name)}"><td><b>${esc(b.name)}</b></td><td>${b.enquiries.length}</td><td>${b.products.length}</td>
        <td>₹${b.enquiries.filter(e => e.payment === "Paid" && e.status !== "declined").reduce((s, e) => s + money(e.price), 0).toLocaleString("en-IN")}</td>
        <td>${brandLink(b.name) ? `<a href="${esc(brandLink(b.name))}" target="_blank" rel="noopener">${esc(brandLink(b.name).replace(/^https:\/\//, ""))}</a>` : `<span class="muted small">after first product</span>`}</td></tr>`).join("")}
      </tbody></table></div>`;
  }
  function vBrand() {
    const b = brandList().find(x => x.name.toLowerCase() === String(openId || "").toLowerCase());
    if (!b) return `<p class="empty">Brand not found. <a href="#brands" data-go="brands">Back</a></p>`;
    const paid = b.enquiries.filter(e => e.payment === "Paid" && e.status !== "declined").reduce((s, e) => s + money(e.price), 0);
    const pending = b.enquiries.filter(e => e.payment === "Pending" && e.status !== "declined").reduce((s, e) => s + money(e.price), 0);
    const reels = [...new Set(b.products.flatMap(p => reelsOf(p.id)))];
    return `<a href="#brands" data-go="brands" class="small" style="font-weight:600;text-decoration:none">← Brands</a>
      <div class="between"><h1>${esc(b.name)}</h1>${brandLink(b.name) ? `<a class="btn main" href="${esc(brandLink(b.name))}" target="_blank" rel="noopener">Their brand page ↗</a>` : ""}</div>
      <div class="grid2">
        <div class="card"><b style="font:700 26px Fraunces,serif">${b.enquiries.length}</b><br><span class="muted small">Collabs / enquiries</span></div>
        <div class="card"><b style="font:700 26px Fraunces,serif">₹${paid.toLocaleString("en-IN")}</b><br><span class="muted small">Paid deals${pending ? ` · ₹${pending.toLocaleString("en-IN")} pending` : ""}</span></div>
        <div class="card"><b style="font:700 26px Fraunces,serif">${b.products.length}</b><br><span class="muted small">Products · ${reels.length} reel${reels.length === 1 ? "" : "s"}</span></div>
      </div>
      <section class="card"><h2>Collabs</h2><div class="list">${b.enquiries.map(e => `<button class="item" data-open="${e.id}"><span><b>${esc(e.package || "Collab")}</b> <span class="muted small">· ${esc(e.price || "—")} · ${esc(e.payment || "")}</span><br><span class="muted small">${date(e.created)}</span></span>${pill(e.status)}</button>`).join("") || `<p class="muted" style="margin:0">No enquiries yet.</p>`}</div></section>
      <section class="card"><h2>Products &amp; reels</h2><div class="list">${b.products.map(p => `<div class="row"><img class="thumb" onerror="this.style.visibility='hidden'" src="${esc(img(p.variants[0]?.image))}" alt="" referrerpolicy="no-referrer"><b>${esc(p.name)}</b><span class="muted small">${reelsOf(p.id).map(r => esc(r.title)).join(" · ")}</span></div>`).join("") || `<p class="muted" style="margin:0">No products yet.</p>`}</div></section>`;
  }

  function render() {
    if (!D) return;
    const body = view === "enquiry" ? vEnquiry() : view === "products" ? vProducts() : view === "reels" ? vReels() : view === "brands" ? vBrands() : view === "brand" ? vBrand() : view === "categories" ? vCategories() : view === "money" ? vMoney() : vEnquiries();
    shell(body);
    if (view === "enquiry") applyFolds();
    const qi = $("q"); if (qi) { qi.oninput = () => { q = qi.value.trim().toLowerCase(); const pos = qi.selectionStart; render(); const n = $("q"); n.focus(); n.setSelectionRange(pos, pos); }; }
    wire();
  }

  // read the product form into editing.form (so re-renders keep what was typed)
  const readPF = () => { const f = $("pf"); if (!f) return; const fd = new FormData(f);
    editing.form = { name: fd.get("name") || "", brand: fd.get("brand") || "", link: fd.get("link") || "", image: fd.get("image") || (editing.form || {}).image || "", category: fd.getAll("cat") }; };

  function wire() {
    root.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); q = ""; go(a.dataset.go); });
    root.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
    root.querySelectorAll("[data-mrange]").forEach(b => b.onclick = () => { moneyRange = b.dataset.mrange; render(); });
    root.querySelectorAll("[data-src]").forEach(b => b.onclick = () => { srcFilter = b.dataset.src; render(); });
    root.querySelectorAll("[data-editp]").forEach(b => b.onclick = () => { go("products"); editing = { id: +b.dataset.editp }; render(); $("pf")?.scrollIntoView({ behavior: "smooth" }); });
    root.querySelectorAll("[data-open]").forEach(b => b.onclick = () => go("enquiry", b.dataset.open));
    root.querySelectorAll("[data-brand]").forEach(b => b.onclick = e => { if (e.target.closest("a")) return; go("brand", b.dataset.brand); });
    root.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { editing = { id: +b.dataset.edit }; render(); $("pf")?.scrollIntoView({ behavior: "smooth" }); });
    root.querySelectorAll("[data-reel]").forEach(b => b.onclick = () => { reelEdit = { code: b.dataset.reel }; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    root.querySelectorAll("[data-fav]").forEach(b => b.onclick = () => {
      const id = +b.dataset.fav, cur = D.featured.map(Number);
      const ids = cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id];
      if (ids.length > 2) return toast("Up to 2 featured — un-star one first");
      act(b, () => api("featured", { ids }), "Featured updated — live in about a minute");
    });
    root.querySelectorAll("[data-status]").forEach(b => b.onclick = () => act(b, () => api("enquiry.update", { id: +openId, patch: { status: b.dataset.status } }), "Status: " + STATUS[b.dataset.status]));
    root.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (!confirmTwice(b)) return; act(b, async () => { await api("product.delete", { id: +b.dataset.del }); editing = null; }, "Product removed — gone from the site in about a minute"); });
    root.querySelectorAll("[data-delreel]").forEach(b => b.onclick = () => { if (!confirmTwice(b)) return; act(b, async () => { await api("reel.delete", { code: b.dataset.delreel }); reelEdit = null; }, "Reel removed"); });
    root.querySelectorAll("[data-act]").forEach(b => b.onclick = async ev => {
      const k = b.dataset.act;
      ev.preventDefault();
      if (k === "addEnq") openAddEnquiry();
      if (k === "delEnq") { if (!confirmTwice(b)) return; act(b, async () => { await api("enquiry.delete", { id: +openId }); view = "enquiries"; openId = null; }, "Deleted"); }
      if (k === "newProd") { editing = { id: null }; render(); $("pf")?.scrollIntoView({ behavior: "smooth" }); }
      if (k === "newReel") { reelEdit = { code: null }; render(); }
      if (k === "cancelEdit") { editing = null; reelEdit = null; render(); }
      if (k === "fetch") { readPF(); if (!editing.form.link) return toast("Paste the product link first");
        b.disabled = true; b.textContent = "Fetching…";
        try { const r = await api("fetch", { link: editing.form.link, name: editing.form.name });
          const f = editing.form;
          if (!f.name && r.name) f.name = r.name;
          if (!f.image && r.image) f.image = r.image;
          if (!f.category.length && r.category) f.category = r.category;
          if (!f.brand && r.brand) f.brand = r.brand;
          toast(r.image ? "Found the photo and details" : "Couldn't find a photo — upload one");
        } catch {}
        render(); }
    });
    const up = $("up"); if (up) up.onchange = () => { const file = up.files[0]; if (!file) return; readPF(); shrink(file).then(url => { editing.photo = url; render(); }); };
    const pf = $("pf"); if (pf) pf.onsubmit = ev => { ev.preventDefault(); readPF(); const f = editing.form, btn = pf.querySelector("button.main");
      act(btn, async () => { const r = await api("product.save", { product: { id: editing.id, ...f, image: /^https?:|^assets\//.test(f.image) ? f.image : "" }, photo: editing.photo || null, enquiryId: view === "enquiry" ? +openId : null }); editing = null; }, "Saved — live in about a minute"); };
    const deal = $("deal"); if (deal) { wireContacts(deal); deal.onsubmit = ev => { ev.preventDefault(); const patch = Object.fromEntries(new FormData(deal)); patch.contacts = readContacts(deal); patch.contact = ""; act(deal.querySelector("button.main"), () => api("enquiry.update", { id: +openId, patch }), "Deal saved"); }; }
    // payment details open once it's paid: a "Payment received" date, or Payment switched to Paid
    if (deal) { const box = deal.querySelector("[data-paidbox]"), was = deal.payment.value,
        upd = () => box.style.display = deal.paid_on.value || deal.txn_id.value || deal.payment_notes.value || (deal.payment.value === "Paid" && was !== "Paid") ? "grid" : "none";
      deal.payment.onchange = upd; deal.paid_on.oninput = upd; deal.paid_on.onchange = upd; }
    root.querySelectorAll("[data-foldall]").forEach(b => b.onclick = () => { const c = b.dataset.foldall === "1", s2 = {};
      root.querySelectorAll("[data-fold]").forEach(sec => { sec.classList.toggle("closed", c); s2[sec.dataset.fold] = c; }); try { localStorage.setItem("skp-fold", JSON.stringify(s2)); } catch {} });
    const pst = $("pst"); if (pst) pst.onsubmit = ev => { ev.preventDefault(); act(pst.querySelector("button.main"), () => api("enquiry.update", { id: +openId, patch: { pitch_stats: JSON.stringify(Object.fromEntries(new FormData(pst))) } }), "Numbers saved"); };
    root.querySelectorAll("[data-pitch]").forEach(b => b.onclick = () => openAddEnquiry(b.dataset.pitch));
    const dlv = $("dlv"); if (dlv) {
      dlv.addEventListener("click", ev => {
        if (ev.target.closest("[data-xadd]")) { dlv.querySelector(".dlist").insertAdjacentHTML("beforeend", extraRow({ t: "", done: false })); dlv.querySelector(".xrow:last-child input").focus(); }
        if (ev.target.closest("[data-xrm]")) ev.target.closest(".xrow").remove();
        if (ev.target.closest("[data-dreset]")) { const e = D.enquiries.find(x => x.id === +openId); dlv.querySelector(".dlist").innerHTML = delivRows(delivDefault(e, deal ? deal.package.value : e.package)); }
      });
      dlv.onsubmit = ev => { ev.preventDefault(); act(dlv.querySelector("button.main"), () => api("enquiry.update", { id: +openId, patch: { deliverables: readDeliv(dlv) } }), "Deliverables saved"); };
    }
    const trf = $("trf"); if (trf) {
      trf.addEventListener("click", ev => {
        if (ev.target.closest("[data-tadd]")) { trf.querySelector(".tlist").insertAdjacentHTML("beforeend", trialRow({ date: today() })); trf.querySelector(".trow:last-child input").focus(); }
        const rm = ev.target.closest("[data-trm]"); if (rm) { if (trf.querySelectorAll(".trow").length > 1) rm.closest(".trow").remove(); else rm.closest(".trow").querySelectorAll("input").forEach(i => i.value = ""); }
      });
      trf.onsubmit = ev => { ev.preventDefault(); act(trf.querySelector("button.main"), () => api("enquiry.update", { id: +openId, patch: { trial_reels: readTrials(trf) } }), "Trial reels saved"); };
    }
    const brief = $("brief"); if (brief) brief.onsubmit = ev => { ev.preventDefault(); act(brief.querySelector("button.main"), () => api("enquiry.update", { id: +openId, patch: Object.fromEntries(new FormData(brief)) }), "Brief saved"); };
    const reelf = $("reelf"); if (reelf) reelf.onsubmit = ev => { ev.preventDefault(); const e = D.enquiries.find(x => x.id === +openId);
      const fd = new FormData(reelf);
      act(reelf.querySelector("button"), () => api("reel.save", { link: fd.get("link"), liveOn: fd.get("live_on"), products: e.product_ids, enquiryId: e.id }), "Reel is live — the website updates in about a minute 🚀"); };
    const rf = $("rf"); if (rf) rf.onsubmit = ev => { ev.preventDefault(); const fd = new FormData(rf);
      act(rf.querySelector("button.main"), async () => { await api("reel.save", { link: fd.get("link"), title: fd.get("title"), products: fd.getAll("p").map(Number) }); reelEdit = null; }, "Reel saved — live in about a minute"); };
  }
  // ---- "+ Add enquiry": one form in a pop-up (for brands that DM'd or emailed you)
  function openAddEnquiry(pitchCode = "") {
    const pk = D.packages || [];
    const dlg = document.createElement("dialog");
    dlg.style.cssText = "border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:90vh;box-shadow:0 20px 60px rgba(43,31,26,.25)";
    dlg.innerHTML = `<form id="addf" method="dialog" style="padding:22px;display:grid;gap:12px">
      <div class="between"><h2 style="margin:0">${pitchCode ? "Pitch this reel to a brand" : "Add an enquiry"}</h2><button type="button" data-x aria-label="Close">✕</button></div>
      <div class="grid2">
        <div style="grid-column:1/-1;display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px">
          <label>🎯 Pitching a reel you already posted? <span class="muted small" style="font-weight:500">(optional)</span><select name="reel_pick"><option value="">— No, a new collab —</option>${D.reels.slice().reverse().map(r => `<option value="${esc(codeOf(r))}" ${codeOf(r) === pitchCode ? "selected" : ""}>${esc(r.title || codeOf(r))}</option>`).join("")}</select></label>
          <label class="small">…or paste its Instagram link<input name="reel_paste" placeholder="https://www.instagram.com/reel/…"></label></div>
        <label>Brand name<input name="brand" required autocomplete="organization"></label>
        <label>Email<input name="email" type="email"></label>
        ${sourceSelect("us")}
        <label>Package<select name="package"><option value=""></option>${pk.map(p => `<option value="${esc(p.name)}">${esc(p.name)}${p.private ? " (private)" : ""}</option>`).join("")}<option>Not sure yet</option></select></label>
        <label>Agreed price<input name="price" placeholder="filled from the package"></label>
        <label>Payment<select name="payment"><option></option><option>Paid</option><option>Barter</option><option>Pending</option></select></label>
        <label>Payment deadline<input name="payment_due" type="date"></label>
        <label>Product value<input name="product_value" placeholder="₹4,999"></label>
        ${contactsBlock([])}
        <label>Their Instagram<input name="instagram" placeholder="@brand"></label>
        <label>Their product link<input name="product_link" placeholder="https://…"></label>
        <label style="grid-column:1/-1">Their message / notes<textarea name="notes" rows="3"></textarea></label>
      </div>
      <div class="row"><button class="main" type="submit">Add enquiry</button><button type="button" data-x>Cancel</button></div></form>`;
    document.body.appendChild(dlg);
    const f = dlg.querySelector("form"), close = () => { dlg.close(); dlg.remove(); };
    dlg.querySelectorAll("[data-x]").forEach(x => x.onclick = close);
    dlg.addEventListener("cancel", close);
    wireContacts(f);
    const pitchPk = pk.find(p => p.private && /after-live/i.test(p.name));
    const pickPitch = () => { if ((f.reel_pick.value || f.reel_paste.value.trim()) && !f.package.value && pitchPk) { f.package.value = pitchPk.name; f.package.onchange(); } };
    f.reel_pick.onchange = pickPitch; f.reel_paste.oninput = pickPitch;
    f.package.onchange = () => { const p = pk.find(x => x.name === f.package.value); if (p) { f.price.value = p.price; f.payment.value = p.payment; } };
    f.onsubmit = async ev => {
      ev.preventDefault();
      const patch = Object.fromEntries(new FormData(f)); patch.contacts = readContacts(f);
      if (!patch.brand.trim()) return f.brand.focus();
      const btn = f.querySelector("button.main"); btn.disabled = true;
      const reel = (patch.reel_pick || patch.reel_paste || "").trim(); delete patch.reel_pick; delete patch.reel_paste;
      if (reel) patch.source = "us";
      try { const r = await api("enquiry.add", { patch, reel }); close(); toast("Enquiry added"); if (r.newId) go("enquiry", r.newId); else render(); }
      catch { btn.disabled = false; }
    };
    dlg.showModal(); pickPitch(); f.brand.focus();
  }
  // destructive buttons need a second tap
  function confirmTwice(b) { if (b.dataset.sure) return true; b.dataset.sure = "1"; const t = b.textContent; b.textContent = "Tap again to confirm"; setTimeout(() => { delete b.dataset.sure; b.textContent = t; }, 3000); return false; }
  // phone photos are big: shrink to 1200 px JPEG before uploading
  function shrink(file) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => { const s = Math.min(1, 1200 / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", .85)); URL.revokeObjectURL(im.src); }; im.onerror = no; im.src = URL.createObjectURL(file); }); }

  root.innerHTML = `<p class="empty">Loading…</p>`;
  try { await api("load"); } catch (e) { if (e.message !== "login") root.innerHTML = `<p class="empty">Couldn't load the dashboard — reload in a minute.</p>`; return; }
  const [v, id] = location.hash.slice(1).split("/"); if (v) { view = v; openId = id ? decodeURIComponent(id) : null; }
  render();
})();
</script>
</body>
