<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Dashboard — ShubhKaPrateek</title>
<!-- Private dashboard: shubhkaprateek.com/admin. Asks for the ADMIN_PASSCODE once per device.
     Everything is read/saved through the bot (bot/admin.js): enquiries in the database, products/reels on GitHub. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #fbf6f1; --surface: #fff; --ink: #2b1f1a; --muted: #6b5a52; --line: #eadfd6; --field: #f3e8df; --accent: #d9534f; --accent-ink: #b8403c; --ok: #2e7d4f; --dark: #2b1f1a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, sans-serif; }
  a { color: var(--accent-ink); }
  .app { display: flex; flex-wrap: wrap; min-height: 100vh; }
  nav { flex: 1 1 220px; max-width: 240px; background: var(--dark); color: #f5ece6; padding: 24px 14px; display: flex; flex-direction: column; gap: 4px; }
  nav .logo { font: 700 21px Fraunces, Georgia, serif; margin: 0 10px 18px; }
  nav a { padding: 11px 12px; border-radius: 10px; color: #f5ece6; text-decoration: none; display: flex; justify-content: space-between; align-items: center; }
  nav a.on { background: var(--accent); color: #fff; font-weight: 600; }
  nav a .n { background: #fff; color: var(--accent-ink); border-radius: 999px; padding: 0 8px; font-size: 13px; font-weight: 700; }
  nav .foot { margin-top: auto; font-size: 13px; color: #c9b8ad; padding: 10px; }
  main { flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 60px; display: flex; flex-direction: column; gap: 18px; }
  @media (max-width: 760px) { nav { max-width: none; flex-direction: row; flex-wrap: wrap; padding: 12px; } nav .logo { width: 100%; margin: 0 4px 6px; } nav .foot { display: none; } }
  h1 { margin: 0; font: 700 clamp(26px, 4vw, 34px) Fraunces, Georgia, serif; }
  h2 { margin: 0 0 10px; font-size: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  button, .btn { font: inherit; font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button.main, .btn.main { background: var(--accent); border-color: transparent; color: #fff; font-weight: 700; }
  button.ok { background: var(--ok); border-color: transparent; color: #fff; font-weight: 700; }
  button.danger { color: #9b2c2c; }
  button:disabled { opacity: .5; cursor: wait; }
  .chip { padding: 7px 13px; border-radius: 999px; font-size: 14px; }
  .chip.on { background: var(--dark); color: #fff; border-color: transparent; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--field); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .s-new { background: var(--accent); color: #fff; } .s-replied { background: #e8eefc; color: #1f4fa3; } .s-hold { background: #fdf0d8; color: #8a5a00; }
  .s-confirmed { background: var(--ok); color: #fff; } .s-product { background: #efe6fb; color: #5b2ea6; } .s-live { background: #e3f3ea; color: #1f6b41; } .s-declined { background: #f1ecea; color: var(--muted); }
  .list { display: grid; gap: 10px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; text-align: left; width: 100%; font-weight: 400; }
  .item:hover { border-color: var(--accent); }
  .table { width: 100%; border-collapse: collapse; }
  .tablebox { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  .table th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--field); padding: 10px 12px; white-space: nowrap; }
  .table td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
  .thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--field); display: block; }
  .cover { width: 44px; height: 70px; border-radius: 8px; object-fit: cover; background: var(--dark); display: block; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 700; }
  .steps span { padding: 5px 11px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--muted); }
  .steps span.done { background: #e3f3ea; border-color: transparent; color: #1f6b41; }
  .steps span.now { background: var(--ok); border-color: transparent; color: #fff; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; max-height: 190px; overflow: auto; padding: 4px; background: var(--field); border-radius: 10px; }
  .cats label { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; background: #fff; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; }
  .cats input { width: auto; }
  .photo { width: 150px; height: 150px; border-radius: 14px; object-fit: contain; background: var(--field); border: 2px dashed #d8c6b9; display: grid; place-items: center; text-align: center; font-size: 13px; color: var(--muted); padding: 8px; }
  .split { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .split > * { flex: 1 1 320px; min-width: 0; }
  .timeline { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--dark); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; max-width: 90vw; }
  .toast.on { opacity: 1; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .login { max-width: 360px; margin: 80px auto; display: grid; gap: 12px; text-align: center; padding: 0 16px; }
  .checks { display: grid; gap: 6px; max-height: 220px; overflow: auto; background: var(--field); border-radius: 10px; padding: 8px; }
  .checks label { display: flex; gap: 8px; align-items: center; font-weight: 500; }
  .checks input { width: auto; }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(async () => {
  const SITE = "https://shubhkaprateek.com";
  const $ = id => document.getElementById(id);
  const root = $("root");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toast = m => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600); };
  const saved = { get: () => { try { return localStorage.getItem("skp-admin-pass") || ""; } catch { return ""; } },
                  set: v => { try { v ? localStorage.setItem("skp-admin-pass", v) : localStorage.removeItem("skp-admin-pass"); } catch {} } };
  const login = msg => {
    root.innerHTML = `<form class="login" id="lf"><h1>Dashboard</h1><p class="muted" style="margin:0">${msg}</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Passcode" required><button class="main">Open</button></form>`;
    $("lf").onsubmit = e => { e.preventDefault(); saved.set($("pw").value.trim()); location.reload(); };
    $("pw").focus();
  };
  const PASS = saved.get();
  if (!PASS) return login("Enter your dashboard passcode");
  let BOT = "";
  try { BOT = ((await (await fetch("/data/site.json", { cache: "no-cache" })).json()).site || {}).reportApi || ""; } catch {}
  if (!BOT) { root.innerHTML = `<p class="empty">Couldn't find the bot's address (data/site.json → reportApi).</p>`; return; }

  let D = null;
  async function api(op, extra = {}) {
    const r = await fetch(BOT + "/admin/api", { method: "POST", headers: { "Content-Type": "application/json", "X-Passcode": PASS }, body: JSON.stringify({ op, ...extra }) });
    const j = await r.json().catch(() => ({ error: "No answer from the bot" }));
    if (r.status === 401) { saved.set(""); login(j.error === "no passcode set" ? "No passcode set yet — run <code>npx wrangler secret put ADMIN_PASSCODE</code> in bot/" : "Wrong passcode — try again"); throw new Error("login"); }
    if (!r.ok || j.error) { toast("⚠ " + (j.error || "Something went wrong")); throw new Error(j.error); }
    if (j.products) D = j;
    return j;
  }
  // run a save: disables the button while it works, then re-renders
  async function act(btn, fn, done) {
    if (btn) btn.disabled = true;
    try { await fn(); if (done) toast(done); render(); } catch (e) { if (btn) btn.disabled = false; }
  }

  // ---------- helpers on the data
  const STATUS = { new: "New", replied: "Replied", hold: "On hold", confirmed: "Confirmed", product: "Product added", live: "Live", declined: "Declined" };
  const FLOW = ["new", "replied", "confirmed", "product", "live"];
  const pill = s => `<span class="pill s-${esc(s)}">${esc(STATUS[s] || s)}</span>`;
  const img = u => !u ? "" : /^https?:/.test(u) ? u : "/" + String(u).replace(/^\//, "");
  const codeOf = r => ((r.reel || "").match(/\/(?:reel|reels|p|tv)\/([A-Za-z0-9_-]+)/) || [])[1] || "";
  const flatCats = () => (D.categories || []).flatMap(c => [{ id: c.id, name: c.name }, ...(c.sub || []).map(s => ({ id: s.id, name: `${c.name} › ${s.name}` }))]);
  const catName = id => (flatCats().find(c => c.id === id) || { name: id }).name.split(" › ").pop();
  const prod = id => D.products.find(p => p.id === +id);
  const reelsOf = id => D.reels.filter(r => (r.products || []).includes(+id));
  const brandLink = name => { const b = Object.values(D.brands || {}).find(b => b.name.toLowerCase() === String(name || "").trim().toLowerCase()); return b ? b.link : ""; };
  const date = s => s ? new Date(s).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "";
  const money = v => { const n = +String(v || "").replace(/[^\d.]/g, ""); return n || 0; };

  // ---------- views
  let view = "enquiries", filter = "all", q = "", openId = null, editing = null, reelEdit = null;
  const go = (v, id = null) => { view = v; openId = id; editing = null; reelEdit = null; location.hash = v + (id != null ? "/" + id : ""); render(); window.scrollTo(0, 0); };
  window.addEventListener("hashchange", () => { const [v, id] = location.hash.slice(1).split("/"); if (v && v !== view + "") { view = v; openId = id || null; render(); } });

  function shell(body) {
    const n = D.enquiries.filter(e => e.status === "new").length;
    root.innerHTML = `<div class="app"><nav aria-label="Dashboard">
      <div class="logo">ShubhKaPrateek</div>
      ${[["enquiries", "Enquiries", n], ["brands", "Brands"], ["products", "Products"], ["reels", "Reels"]].map(([k, t, c]) =>
        `<a href="#${k}" data-go="${k}" class="${view === k || (view === "enquiry" && k === "enquiries") || (view === "brand" && k === "brands") ? "on" : ""}">${t}${c ? `<span class="n">${c}</span>` : ""}</a>`).join("")}
      <a href="${SITE}/" target="_blank" rel="noopener">Open website ↗</a>
      <div class="foot">Saves go live on the website in about a minute.</div></nav><main>${body}</main></div>`;
  }

  // ---- Enquiries
  function vEnquiries() {
    const list = D.enquiries.filter(e => (filter === "all" || e.status === filter) && (!q || (e.brand + " " + e.email).toLowerCase().includes(q)));
    const count = s => D.enquiries.filter(e => e.status === s).length;
    return `<div class="between"><h1>Enquiries</h1><div class="row"><input id="q" placeholder="Search brands…" value="${esc(q)}" style="width:220px"><button class="main" data-act="addEnq">+ Add enquiry</button></div></div>
      <div class="row">${["all", "new", "replied", "hold", "confirmed", "product", "live", "declined"].map(s =>
        `<button class="chip ${filter === s ? "on" : ""}" data-filter="${s}">${s === "all" ? "All" : STATUS[s]} ${s === "all" ? D.enquiries.length : count(s)}</button>`).join("")}</div>
      <div class="list">${list.map(e => `<button class="item" data-open="${e.id}">
          <span><b>${esc(e.brand)}</b> <span class="muted small">· ${esc(e.package || "—")}</span><br><span class="muted small">${esc(e.email)} · ${date(e.created)}</span></span>
          ${pill(e.status)}</button>`).join("") || `<p class="empty">No enquiries here yet. When a brand sends the form on your media kit, it shows up here.</p>`}</div>`;
  }

  function vEnquiry() {
    const e = D.enquiries.find(x => x.id === +openId); if (!e) return `<p class="empty">That enquiry is gone. <a href="#enquiries" data-go="enquiries">Back</a></p>`;
    const at = FLOW.indexOf(e.status);
    const prods = (e.product_ids || []).map(prod).filter(Boolean);
    const ev = D.events.filter(x => x.enquiry_id === e.id);
    const reelUrl = e.reel_code ? `${SITE}/reel/${e.reel_code}` : "";
    const mail = `mailto:${encodeURIComponent(e.email)}?subject=${encodeURIComponent("Collab with ShubhKaPrateek — " + e.brand)}&body=${encodeURIComponent(`Hi ${e.brand} team,\n\nThank you for reaching out! We'd love to work with you on ${e.package || "a collab"}.\n\n[your reply]\n\nWarm regards,\nShubhi & Prateek\n@shubhkaprateek | shubhkaprateek.com`)}`;
    return `<a href="#enquiries" data-go="enquiries" class="small" style="font-weight:600;text-decoration:none">← Enquiries</a>
      <div class="between"><h1>${esc(e.brand)} <span class="muted" style="font:500 16px Inter,sans-serif">· ${esc(e.package || "—")}</span></h1>${pill(e.status)}</div>
      <div class="steps">${FLOW.map((s, i) => `<span class="${i < at ? "done" : i === at ? "now" : ""}">${STATUS[s]}${i < at ? " ✓" : ""}</span>`).join("")}</div>
      <div class="row">
        <a class="btn" href="${mail}" data-act="replied">Reply by email</a>
        ${e.status !== "confirmed" && at < 2 ? `<button class="ok" data-status="confirmed">Confirm</button>` : ""}
        ${e.status !== "hold" ? `<button data-status="hold">Put on hold</button>` : ""}
        ${e.status !== "declined" ? `<button class="danger" data-status="declined">Decline</button>` : `<button data-status="new">Reopen</button>`}
        <button class="danger" data-act="delEnq" style="margin-left:auto">Delete</button>
      </div>
      <div class="split">
        <section class="card"><h2>The deal</h2><form id="deal" class="grid2">
          <label>Brand<input name="brand" value="${esc(e.brand)}"></label>
          <label>Email<input name="email" value="${esc(e.email)}"></label>
          <label>Package<input name="package" value="${esc(e.package)}"></label>
          <label>Agreed price<input name="price" value="${esc(e.price)}" placeholder="₹3,000"></label>
          <label>Payment<select name="payment">${["", "Pending", "Paid", "Barter"].map(o => `<option ${o === (e.payment || "") ? "selected" : ""}>${o}</option>`).join("")}</select></label>
          <label>Product value<input name="product_value" value="${esc(e.product_value)}" placeholder="₹4,999"></label>
          <label>Shoot by<input name="shoot_by" type="date" value="${esc(e.shoot_by)}"></label>
          <label>Post by<input name="post_by" type="date" value="${esc(e.post_by)}"></label>
          <label>Contact person / phone<input name="contact" value="${esc(e.contact)}"></label>
          <label>Their product link<input name="product_link" value="${esc(e.product_link)}"></label>
          <label style="grid-column:1/-1">Their message<textarea name="message" rows="2">${esc(e.message)}</textarea></label>
          <label style="grid-column:1/-1">Your notes<textarea name="notes" rows="2">${esc(e.notes)}</textarea></label>
          <div><button class="main">Save deal</button></div></form></section>
        <section class="card"><h2>History</h2><div class="timeline">${ev.map(x => `<span><b style="color:var(--ink)">${date(x.at)}</b> · ${esc(x.text)}</span>`).join("") || "—"}</div></section>
      </div>
      <section class="card"><div class="between"><h2>Their products</h2><button data-act="newProd">+ Add product</button></div>
        ${prods.length ? `<div class="list">${prods.map(p => `<div class="row"><img class="thumb" onerror="this.style.visibility='hidden'" src="${esc(img(p.variants[0]?.image))}" alt="" referrerpolicy="no-referrer"><b>${esc(p.name)}</b><span class="muted small">${(p.category || []).map(catName).map(esc).join(" · ")}</span><button data-edit="${p.id}">Edit</button></div>`).join("")}</div>` : `<p class="muted" style="margin:0">Confirm the collab, then add the product they're sending: paste its link and the photo, name and categories fill in.</p>`}
        ${editing ? productForm(e) : ""}
      </section>
      <section class="card"><h2>Reel</h2>
        ${e.reel_code ? `<p style="margin:0 0 10px">Live: <a href="${reelUrl}" target="_blank" rel="noopener">${reelUrl}</a> · brand page: ${brandLink(e.brand) ? `<a href="${esc(brandLink(e.brand))}" target="_blank" rel="noopener">${esc(brandLink(e.brand))}</a>` : "—"}</p>` : ""}
        ${prods.length ? `<form id="reelf" class="row"><input name="link" placeholder="https://www.instagram.com/reel/…" value="${e.reel_code ? "https://www.instagram.com/reel/" + esc(e.reel_code) + "/" : ""}" style="flex:1 1 280px"><button class="main">${e.reel_code ? "Update reel" : "Go live →"}</button></form>
          <p class="muted small" style="margin:8px 0 0">Makes the reel page, connects it to their product${prods.length > 1 ? "s" : ""} and publishes the website. Status → Live.</p>` : `<p class="muted" style="margin:0">Add their product first.</p>`}
      </section>`;
  }

  // the product form (used inside an enquiry and on the Products page)
  function productForm(e) {
    const p = editing.id ? prod(editing.id) : null, v = (p && p.variants && p.variants[0]) || {};
    const f = editing.form || { name: p ? p.name : "", brand: p ? p.brand || "" : (e ? e.brand : ""), link: v.link || (e ? e.product_link : "") || "", image: v.image || "", category: p ? [].concat(p.category || []) : [] };
    editing.form = f;
    return `<form id="pf" class="card" style="margin-top:12px;background:var(--bg)">
      <h2>${p ? "Edit " + esc(p.name) : "New product"}</h2>
      <div class="split">
        <div style="flex:0 0 150px;display:grid;gap:8px">
          ${editing.photo || f.image ? `<img class="photo" src="${esc(editing.photo || img(f.image))}" alt="Product photo" referrerpolicy="no-referrer">` : `<div class="photo">Photo appears here after "Fetch details" — or upload one</div>`}
          <label class="btn" style="justify-content:center">Upload photo<input id="up" type="file" accept="image/*" hidden></label>
        </div>
        <div style="display:grid;gap:12px">
          <label>Product link<span class="row"><input name="link" value="${esc(f.link)}" placeholder="https://…" style="flex:1 1 200px"><button type="button" data-act="fetch">Fetch details</button></span></label>
          <label>Name<input name="name" value="${esc(f.name)}" required></label>
          <label>Brand<input name="brand" value="${esc(f.brand)}" placeholder="e.g. Deciwood"></label>
          <label>Photo link (optional)<input name="image" value="${esc(/^https?:/.test(f.image) ? f.image : "")}" placeholder="https://…jpg"></label>
          <div><b class="small">Categories</b><div class="cats">${flatCats().map(c => `<label><input type="checkbox" name="cat" value="${esc(c.id)}" ${f.category.includes(c.id) ? "checked" : ""}>${esc(c.name)}</label>`).join("")}</div></div>
        </div>
      </div>
      <div class="row" style="margin-top:12px"><button class="main">${p ? "Save changes" : "Save product"}</button><button type="button" data-act="cancelEdit">Cancel</button>
        ${p ? `<button type="button" class="danger" data-del="${p.id}" style="margin-left:auto">Delete product</button>` : ""}</div>
    </form>`;
  }

  // ---- Products
  function vProducts() {
    const list = D.products.filter(p => !q || (p.name + " " + (p.brand || "") + " " + (p.category || []).map(catName).join(" ")).toLowerCase().includes(q));
    const fav = D.featured.map(Number);
    return `<div class="between"><h1>Products <span class="muted" style="font:500 16px Inter,sans-serif">${D.products.length}</span></h1>
        <div class="row"><input id="q" placeholder="Search products, brands, categories…" value="${esc(q)}" style="width:260px"><button class="main" data-act="newProd">+ New product</button></div></div>
      ${editing ? productForm(null) : ""}
      <div class="tablebox"><table class="table"><thead><tr><th></th><th>Product</th><th>Brand</th><th>Categories</th><th>Reels</th><th>Featured</th><th></th></tr></thead><tbody>
      ${list.map(p => `<tr><td><img class="thumb" onerror="this.style.visibility='hidden'" src="${esc(img(p.variants[0]?.image))}" alt="" loading="lazy" referrerpolicy="no-referrer"></td>
        <td><b>${esc(p.name)}</b><br><span class="muted small">#${p.id}</span></td>
        <td>${p.brand ? esc(p.brand) : `<span class="muted small">—</span>`}</td>
        <td class="small">${(p.category || []).map(catName).map(esc).join(" · ") || "—"}</td>
        <td>${reelsOf(p.id).length}</td>
        <td><button class="chip ${fav.includes(p.id) ? "on" : ""}" data-fav="${p.id}" aria-label="Featured">${fav.includes(p.id) ? "★" : "☆"}</button></td>
        <td><div class="row" style="flex-wrap:nowrap"><button data-edit="${p.id}">Edit</button><a class="btn" href="${SITE}/product/${p.id}" target="_blank" rel="noopener">View ↗</a></div></td></tr>`).join("")}
      </tbody></table></div>`;
  }

  // ---- Reels
  function vReels() {
    const list = D.reels.filter(r => !q || (r.title + " " + codeOf(r)).toLowerCase().includes(q)).slice().reverse();
    return `<div class="between"><h1>Reels <span class="muted" style="font:500 16px Inter,sans-serif">${D.reels.length}</span></h1>
        <div class="row"><input id="q" placeholder="Search reels…" value="${esc(q)}" style="width:220px"><button class="main" data-act="newReel">+ New reel</button></div></div>
      ${reelEdit ? reelForm() : ""}
      <div class="tablebox"><table class="table"><thead><tr><th></th><th>Reel</th><th>Products</th><th></th></tr></thead><tbody>
      ${list.map(r => `<tr><td><img class="cover" src="/assets/covers/${esc(codeOf(r))}.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></td>
        <td><b>${esc(r.title)}</b><br><span class="muted small">${esc(codeOf(r))}</span></td>
        <td class="small">${(r.products || []).map(prod).filter(Boolean).map(p => esc(p.name)).join(", ")}</td>
        <td><div class="row" style="flex-wrap:nowrap"><button data-reel="${esc(codeOf(r))}">Edit</button><a class="btn" href="${SITE}/reel/${esc(codeOf(r))}" target="_blank" rel="noopener">View ↗</a></div></td></tr>`).join("")}
      </tbody></table></div>`;
  }
  function reelForm() {
    const r = reelEdit.code ? D.reels.find(x => codeOf(x) === reelEdit.code) : null;
    const chosen = new Set(r ? r.products : []);
    return `<form id="rf" class="card" style="background:var(--bg)"><h2>${r ? "Edit reel" : "New reel"}</h2>
      <div class="grid2"><label>Reel link<input name="link" value="${r ? esc(r.reel) : ""}" placeholder="https://www.instagram.com/reel/…" ${r ? "readonly" : ""}></label>
        <label>Title (optional — read from Instagram)<input name="title" value="${r ? esc(r.title) : ""}"></label></div>
      <div style="margin-top:12px"><b class="small">Products in this reel</b><div class="checks">${D.products.slice().reverse().map(p => `<label><input type="checkbox" name="p" value="${p.id}" ${chosen.has(p.id) ? "checked" : ""}>${esc(p.name)} <span class="muted small">#${p.id}</span></label>`).join("")}</div></div>
      <div class="row" style="margin-top:12px"><button class="main">${r ? "Save reel" : "Go live →"}</button><button type="button" data-act="cancelEdit">Cancel</button>
        ${r ? `<button type="button" class="danger" data-delreel="${esc(reelEdit.code)}" style="margin-left:auto">Delete reel</button>` : ""}</div></form>`;
  }

  // ---- Brands
  function brandList() {
    const map = new Map();
    const add = (name, k, x) => { const key = String(name || "").trim().toLowerCase(); if (!key) return; if (!map.has(key)) map.set(key, { name: String(name).trim(), products: [], enquiries: [] }); map.get(key)[k].push(x); };
    D.products.forEach(p => add(p.brand, "products", p));
    D.enquiries.forEach(e => add(e.brand, "enquiries", e));
    return [...map.values()].sort((a, b) => (b.enquiries.length + b.products.length) - (a.enquiries.length + a.products.length));
  }
  function vBrands() {
    const list = brandList().filter(b => !q || b.name.toLowerCase().includes(q));
    return `<div class="between"><h1>Brands <span class="muted" style="font:500 16px Inter,sans-serif">${list.length}</span></h1><input id="q" placeholder="Search brands…" value="${esc(q)}" style="width:220px"></div>
      <div class="tablebox"><table class="table"><thead><tr><th>Brand</th><th>Collabs</th><th>Products</th><th>Earned</th><th>Brand page</th></tr></thead><tbody>
      ${list.map(b => `<tr style="cursor:pointer" data-brand="${esc(b.name)}"><td><b>${esc(b.name)}</b></td><td>${b.enquiries.length}</td><td>${b.products.length}</td>
        <td>₹${b.enquiries.filter(e => e.payment === "Paid").reduce((s, e) => s + money(e.price), 0).toLocaleString("en-IN")}</td>
        <td>${brandLink(b.name) ? `<a href="${esc(brandLink(b.name))}" target="_blank" rel="noopener">${esc(brandLink(b.name).replace(/^https:\/\//, ""))}</a>` : `<span class="muted small">after first product</span>`}</td></tr>`).join("")}
      </tbody></table></div>`;
  }
  function vBrand() {
    const b = brandList().find(x => x.name.toLowerCase() === String(openId || "").toLowerCase());
    if (!b) return `<p class="empty">Brand not found. <a href="#brands" data-go="brands">Back</a></p>`;
    const paid = b.enquiries.filter(e => e.payment === "Paid").reduce((s, e) => s + money(e.price), 0);
    const pending = b.enquiries.filter(e => e.payment === "Pending").reduce((s, e) => s + money(e.price), 0);
    const reels = [...new Set(b.products.flatMap(p => reelsOf(p.id)))];
    return `<a href="#brands" data-go="brands" class="small" style="font-weight:600;text-decoration:none">← Brands</a>
      <div class="between"><h1>${esc(b.name)}</h1>${brandLink(b.name) ? `<a class="btn main" href="${esc(brandLink(b.name))}" target="_blank" rel="noopener">Their brand page ↗</a>` : ""}</div>
      <div class="grid2">
        <div class="card"><b style="font:700 26px Fraunces,serif">${b.enquiries.length}</b><br><span class="muted small">Collabs / enquiries</span></div>
        <div class="card"><b style="font:700 26px Fraunces,serif">₹${paid.toLocaleString("en-IN")}</b><br><span class="muted small">Earned${pending ? ` · ₹${pending.toLocaleString("en-IN")} pending` : ""}</span></div>
        <div class="card"><b style="font:700 26px Fraunces,serif">${b.products.length}</b><br><span class="muted small">Products · ${reels.length} reel${reels.length === 1 ? "" : "s"}</span></div>
      </div>
      <section class="card"><h2>Collabs</h2><div class="list">${b.enquiries.map(e => `<button class="item" data-open="${e.id}"><span><b>${esc(e.package || "Collab")}</b> <span class="muted small">· ${esc(e.price || "—")} · ${esc(e.payment || "")}</span><br><span class="muted small">${date(e.created)}</span></span>${pill(e.status)}</button>`).join("") || `<p class="muted" style="margin:0">No enquiries yet.</p>`}</div></section>
      <section class="card"><h2>Products &amp; reels</h2><div class="list">${b.products.map(p => `<div class="row"><img class="thumb" onerror="this.style.visibility='hidden'" src="${esc(img(p.variants[0]?.image))}" alt="" referrerpolicy="no-referrer"><b>${esc(p.name)}</b><span class="muted small">${reelsOf(p.id).map(r => esc(r.title)).join(" · ")}</span></div>`).join("") || `<p class="muted" style="margin:0">No products yet.</p>`}</div></section>`;
  }

  function render() {
    if (!D) return;
    const body = view === "enquiry" ? vEnquiry() : view === "products" ? vProducts() : view === "reels" ? vReels() : view === "brands" ? vBrands() : view === "brand" ? vBrand() : vEnquiries();
    shell(body);
    const qi = $("q"); if (qi) { qi.oninput = () => { q = qi.value.trim().toLowerCase(); const pos = qi.selectionStart; render(); const n = $("q"); n.focus(); n.setSelectionRange(pos, pos); }; }
    wire();
  }

  // read the product form into editing.form (so re-renders keep what was typed)
  const readPF = () => { const f = $("pf"); if (!f) return; const fd = new FormData(f);
    editing.form = { name: fd.get("name") || "", brand: fd.get("brand") || "", link: fd.get("link") || "", image: fd.get("image") || (editing.form || {}).image || "", category: fd.getAll("cat") }; };

  function wire() {
    root.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); q = ""; go(a.dataset.go); });
    root.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
    root.querySelectorAll("[data-open]").forEach(b => b.onclick = () => go("enquiry", b.dataset.open));
    root.querySelectorAll("[data-brand]").forEach(b => b.onclick = e => { if (e.target.closest("a")) return; go("brand", b.dataset.brand); });
    root.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { editing = { id: +b.dataset.edit }; render(); $("pf")?.scrollIntoView({ behavior: "smooth" }); });
    root.querySelectorAll("[data-reel]").forEach(b => b.onclick = () => { reelEdit = { code: b.dataset.reel }; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    root.querySelectorAll("[data-fav]").forEach(b => b.onclick = () => {
      const id = +b.dataset.fav, cur = D.featured.map(Number);
      const ids = cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id];
      if (ids.length > 2) return toast("Up to 2 featured — un-star one first");
      act(b, () => api("featured", { ids }), "Featured updated — live in about a minute");
    });
    root.querySelectorAll("[data-status]").forEach(b => b.onclick = () => act(b, () => api("enquiry.update", { id: +openId, patch: { status: b.dataset.status } }), "Status: " + STATUS[b.dataset.status]));
    root.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (!confirmTwice(b)) return; act(b, async () => { await api("product.delete", { id: +b.dataset.del }); editing = null; }, "Product removed — gone from the site in about a minute"); });
    root.querySelectorAll("[data-delreel]").forEach(b => b.onclick = () => { if (!confirmTwice(b)) return; act(b, async () => { await api("reel.delete", { code: b.dataset.delreel }); reelEdit = null; }, "Reel removed"); });
    root.querySelectorAll("[data-act]").forEach(b => b.onclick = async ev => {
      const k = b.dataset.act;
      if (k === "replied") { const e = D.enquiries.find(x => x.id === +openId); if (e && ["new", "hold"].includes(e.status)) api("enquiry.update", { id: e.id, patch: { status: "replied" } }).then(render).catch(() => {}); return; }
      ev.preventDefault();
      if (k === "addEnq") { const brand = prompt("Brand name?"); if (!brand) return; const email = prompt("Their email (optional)") || ""; act(b, async () => { await api("enquiry.add", { patch: { brand, email } }); }, "Enquiry added"); }
      if (k === "delEnq") { if (!confirmTwice(b)) return; act(b, async () => { await api("enquiry.delete", { id: +openId }); view = "enquiries"; openId = null; }, "Deleted"); }
      if (k === "newProd") { editing = { id: null }; render(); $("pf")?.scrollIntoView({ behavior: "smooth" }); }
      if (k === "newReel") { reelEdit = { code: null }; render(); }
      if (k === "cancelEdit") { editing = null; reelEdit = null; render(); }
      if (k === "fetch") { readPF(); if (!editing.form.link) return toast("Paste the product link first");
        b.disabled = true; b.textContent = "Fetching…";
        try { const r = await api("fetch", { link: editing.form.link, name: editing.form.name });
          const f = editing.form;
          if (!f.name && r.name) f.name = r.name;
          if (!f.image && r.image) f.image = r.image;
          if (!f.category.length && r.category) f.category = r.category;
          if (!f.brand && r.brand) f.brand = r.brand;
          toast(r.image ? "Found the photo and details" : "Couldn't find a photo — upload one");
        } catch {}
        render(); }
    });
    const up = $("up"); if (up) up.onchange = () => { const file = up.files[0]; if (!file) return; readPF(); shrink(file).then(url => { editing.photo = url; render(); }); };
    const pf = $("pf"); if (pf) pf.onsubmit = ev => { ev.preventDefault(); readPF(); const f = editing.form, btn = pf.querySelector("button.main");
      act(btn, async () => { const r = await api("product.save", { product: { id: editing.id, ...f, image: /^https?:|^assets\//.test(f.image) ? f.image : "" }, photo: editing.photo || null, enquiryId: view === "enquiry" ? +openId : null }); editing = null; }, "Saved — live in about a minute"); };
    const deal = $("deal"); if (deal) deal.onsubmit = ev => { ev.preventDefault(); const patch = Object.fromEntries(new FormData(deal)); act(deal.querySelector("button"), () => api("enquiry.update", { id: +openId, patch }), "Deal saved"); };
    const reelf = $("reelf"); if (reelf) reelf.onsubmit = ev => { ev.preventDefault(); const e = D.enquiries.find(x => x.id === +openId);
      act(reelf.querySelector("button"), () => api("reel.save", { link: new FormData(reelf).get("link"), products: e.product_ids, enquiryId: e.id }), "Reel is live — the website updates in about a minute 🚀"); };
    const rf = $("rf"); if (rf) rf.onsubmit = ev => { ev.preventDefault(); const fd = new FormData(rf);
      act(rf.querySelector("button.main"), async () => { await api("reel.save", { link: fd.get("link"), title: fd.get("title"), products: fd.getAll("p").map(Number) }); reelEdit = null; }, "Reel saved — live in about a minute"); };
  }
  // destructive buttons need a second tap
  function confirmTwice(b) { if (b.dataset.sure) return true; b.dataset.sure = "1"; const t = b.textContent; b.textContent = "Tap again to confirm"; setTimeout(() => { delete b.dataset.sure; b.textContent = t; }, 3000); return false; }
  // phone photos are big: shrink to 1200 px JPEG before uploading
  function shrink(file) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => { const s = Math.min(1, 1200 / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", .85)); URL.revokeObjectURL(im.src); }; im.onerror = no; im.src = URL.createObjectURL(file); }); }

  root.innerHTML = `<p class="empty">Loading…</p>`;
  try { await api("load"); } catch (e) { if (e.message !== "login") root.innerHTML = `<p class="empty">Couldn't load the dashboard — reload in a minute.</p>`; return; }
  const [v, id] = location.hash.slice(1).split("/"); if (v) { view = v; openId = id ? decodeURIComponent(id) : null; }
  render();
})();
</script>
</body>
</html>
