<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Dashboard — ShubhKaPrateek</title>
<!-- Private dashboard: shubhkaprateek.com/admin. Asks for the ADMIN_PASSCODE once per device.
     Everything is read/saved through the bot (bot/admin.js): enquiries in the database, products/reels on GitHub. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #fbf6f1; --surface: #fff; --ink: #2b1f1a; --muted: #6b5a52; --line: #eadfd6; --field: #f3e8df; --accent: #d9534f; --accent-ink: #b8403c; --ok: #2e7d4f; --dark: #2b1f1a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, sans-serif; }
  a { color: var(--accent-ink); }
  .app { display: flex; flex-wrap: wrap; min-height: 100vh; }
  nav { flex: 1 1 220px; max-width: 240px; background: var(--dark); color: #f5ece6; padding: 24px 14px; display: flex; flex-direction: column; gap: 4px; }
  nav .logo { font: 700 21px Fraunces, Georgia, serif; margin: 0 10px 18px; }
  nav a { padding: 11px 12px; border-radius: 10px; color: #f5ece6; text-decoration: none; display: flex; justify-content: space-between; align-items: center; }
  nav a.on { background: var(--accent); color: #fff; font-weight: 600; }
  nav a .n { background: #fff; color: var(--accent-ink); border-radius: 999px; padding: 0 8px; font-size: 13px; font-weight: 700; }
  nav .foot { margin-top: auto; font-size: 13px; color: #c9b8ad; padding: 10px; }
  main { flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 60px; display: flex; flex-direction: column; gap: 18px; }
  nav .links { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  nav .top { display: flex; align-items: center; justify-content: space-between; }
  nav .burger { display: none; background: transparent; border: 1px solid rgba(245,236,230,.35); color: #f5ece6; width: 44px; height: 44px; border-radius: 10px; font-size: 20px; padding: 0; }
  @media (max-width: 760px) {
    nav { max-width: none; flex: none; width: 100%; box-sizing: border-box; padding: 10px 14px; position: sticky; top: 0; z-index: 20; }
    nav .logo { margin: 0; } nav .burger { display: inline-grid; place-items: center; } nav .foot { display: none; }
    nav .links { display: none; flex-direction: column; gap: 2px; padding-top: 10px; } nav.open .links { display: flex; }
  }
  h1 { margin: 0; font: 700 clamp(26px, 4vw, 34px) Fraunces, Georgia, serif; }
  h2 { margin: 0 0 10px; font-size: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  button, .btn { font: inherit; font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button.main, .btn.main { background: var(--accent); border-color: transparent; color: #fff; font-weight: 700; }
  button.ok { background: var(--ok); border-color: transparent; color: #fff; font-weight: 700; }
  button.danger { color: #9b2c2c; }
  button:disabled { opacity: .5; cursor: wait; }
  .chip { padding: 7px 13px; border-radius: 999px; font-size: 14px; }
  .chip.on { background: var(--dark); color: #fff; border-color: transparent; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--field); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .s-new { background: #d9534f; color: #fff; }               /* red — needs a reply */
  .s-confirmed { background: #2f6fdb; color: #fff; }         /* blue */
  .s-product { background: #7b4fd6; color: #fff; }           /* purple */
  .s-live { background: #e8890c; color: #fff; }              /* orange — ongoing */
  .s-delivered { background: #1f8a4c; color: #fff; }         /* green — done */
  .s-hold { background: #f2c94c; color: #5a4300; }           /* yellow */
  .s-declined { background: #8f8580; color: #fff; }          /* grey */
  .list { display: grid; gap: 10px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; text-align: left; width: 100%; font-weight: 400; }
  .item:hover { border-color: var(--accent); }
  .table { width: 100%; border-collapse: collapse; }
  .tablebox { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  .table th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--field); padding: 10px 12px; white-space: nowrap; }
  .table td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
  .thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--field); display: block; }
  .cover { width: 44px; height: 70px; border-radius: 8px; object-fit: cover; background: var(--dark); display: block; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 700; }
  .steps span { padding: 5px 11px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--muted); }
  .steps span.done { background: #e3f3ea; border-color: transparent; color: #1f6b41; }
  .steps span.now { background: var(--ok); border-color: transparent; color: #fff; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; max-height: 190px; overflow: auto; padding: 4px; background: var(--field); border-radius: 10px; }
  .cats label { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; background: #fff; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; }
  .cats input { width: auto; }
  .drow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .drow .dl { flex: 1 1 200px; display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .drow input[type=checkbox] { width: auto; }
  .drow .cnt { display: flex; gap: 6px; align-items: center; } .drow .cnt input { width: 70px; }
  .drow .done { display: flex; gap: 6px; align-items: center; }
  .drow.xrow { flex-wrap: nowrap; } .drow.xrow input[data-xt] { flex: 1 1 auto; min-width: 0; }
  .sbtn { width: 34px; height: 34px; min-height: 0; padding: 0; border-radius: 8px; line-height: 1; flex: none; display: inline-grid; place-items: center; text-decoration: none; }
  .trow { position: relative; display: grid; grid-template-columns: 2fr 160px 2fr; gap: 8px; align-items: center; padding-right: 84px; }
  .trow .tb { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; }
  @media (max-width: 760px) { .trow { grid-template-columns: 1fr; border: 1px solid var(--line); border-radius: 12px; padding: 10px 84px 10px 10px; } .trow .tb { top: 10px; right: 10px; transform: none; } }
  .kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .kv dd .ct { display: block; } .kv .sub { grid-column: 1 / -1; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  @media (max-width: 760px) { .kv { grid-template-columns: 1fr; gap: 0; } .kv dd { margin-bottom: 8px; } }
  .vlist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
  .vlist li { display: flex; gap: 8px; align-items: baseline; } .vlist .no { color: var(--muted); }
  .pre { white-space: pre-wrap; font: inherit; margin: 0; background: var(--field); border-radius: 10px; padding: 12px; font-size: 14px; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #f7efe8; } tr.gold.click:hover td { background: #f6e6b8; }
  tr.gold td { background: #fbf1d4; } tr.gold td:first-child { box-shadow: inset 4px 0 0 #d4a62a; }
  .gold-key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #fbf1d4; box-shadow: inset 3px 0 0 #d4a62a; vertical-align: -1px; }
  .stats4 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 760px) { .stats4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat.big { background: var(--dark); color: #f5ece6; border-color: var(--dark); } .stat.big span { color: #c9b8ad; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat b { font: 700 26px Fraunces, Georgia, serif; display: block; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat.warn b { color: #9b2c2c; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding: 8px 0 0; border-bottom: 1px solid var(--line); }
  .bars { height: 170px !important; }
  .bars .col { flex: 1 1 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; min-width: 0; }
  .bars .col em { font-style: normal; font-size: 11px; font-weight: 700; text-align: center; color: var(--ink); white-space: nowrap; margin: 0 -24px 3px; }
  .bars .bar { display: flex; flex-direction: column; border-radius: 4px 4px 0 0; overflow: hidden; }
  @media (max-width: 760px) { .xlab .yr { display: none; } }
  .xlab { display: flex; gap: 3px; margin-top: 4px; } .xlab span { flex: 1 1 0; text-align: center; font-size: 11px; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
  @media (max-width: 760px) { .bars .col em { font-size: 9px; } }
  .bars .bar i { display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
  .bars .bar i b { font-size: 11px; font-style: normal; font-weight: 700; color: #fff; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.25); } .bars .bar i.c { background: var(--accent); } .bars .bar i.p { background: #d4a62a; } .bars .bar i.z { flex: 1; background: var(--line); }
  .ctree { display: grid; gap: 10px; max-height: 320px; overflow: auto; padding: 10px; background: var(--field); border-radius: 10px; }
  .ctree .grp { display: grid; gap: 6px; }
  .ctree .kids { display: flex; flex-wrap: wrap; gap: 6px; margin-left: 14px; padding-left: 12px; border-left: 2px solid var(--line); }
  .ctree label { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; background: #fff; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; width: fit-content; }
  .ctree .top { font-weight: 700; }
  .ctree input { width: auto; }
  .tree details { border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .tree details details { border: 0; border-left: 2px solid var(--line); border-radius: 0; margin: 0 0 6px 18px; }
  .tree summary { cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; list-style: none; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary::before { content: "▸"; color: var(--muted, #6b5a52); width: 12px; }
  .tree details[open] > summary::before { content: "▾"; }
  .tree summary .cbtns { display: flex; gap: 6px; margin-left: 10px; } .tree summary .cbtns button { padding: 4px 10px; min-height: 0; font-size: 13px; }
  .tree summary .n { margin-left: auto; font-size: 13px; color: var(--muted, #6b5a52); font-weight: 600; }
  .tree .leaf { display: flex; gap: 10px; align-items: center; padding: 6px 14px 6px 36px; }
  @media (max-width: 760px) { .tree .leaf { padding-left: 14px; } .tree details details { margin-left: 8px; } }
  .tree .leaf b { font-weight: 500; flex: 1 1 auto; }
  .photo { width: 150px; height: 150px; border-radius: 14px; object-fit: contain; background: var(--field); border: 2px dashed #d8c6b9; display: grid; place-items: center; text-align: center; font-size: 13px; color: var(--muted); padding: 8px; }
  .split { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .split > * { flex: 1 1 320px; min-width: 0; }
  .timeline { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .hist { display: grid; gap: 2px; font-size: 14px; }
  .hist .h { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .hist .h b.d { color: var(--ink); font-size: 13px; } .hist .h b.d .tm { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
  .hist .log { color: var(--muted); font-size: 13px; }
  .hist .note { font-weight: 600; } .hist .note-x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 12px; } .hist .note-x:hover { color: #9b2c2c; }
  .hist .due { color: var(--accent-ink, #b8403c); }
  .hist .late { color: #9b2c2c; font-weight: 600; }
  .hist .head { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; }
  [data-fold] > :first-child { cursor: pointer; user-select: none; position: relative; padding-right: 30px; }
  [data-fold] > :first-child::after { content: "▾"; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }
  [data-fold].closed > :first-child { margin-bottom: 0; }
  [data-fold].closed > :first-child::after { content: "▸"; }
  [data-fold].closed > :not(:first-child) { display: none !important; }
  [data-fold] .hint { font: 500 13px Inter, sans-serif; color: var(--muted); margin-left: 6px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--dark); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; max-width: 90vw; }
  .toast.on { opacity: 1; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .login { max-width: 360px; margin: 80px auto; display: grid; gap: 12px; text-align: center; padding: 0 16px; }
  .checks { display: grid; gap: 6px; max-height: 220px; overflow: auto; background: var(--field); border-radius: 10px; padding: 8px; }
  .checks label { display: flex; gap: 8px; align-items: center; font-weight: 500; }
  .checks input { width: auto; }
  @media (max-width: 760px) { .idea-row { flex-direction: column; gap: 10px; } }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(async () => {
  const SITE = "https://shubhkaprateek.com";
  const $ = id => document.getElementById(id);
  const root = $("root");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toast = m => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600); };
  const saved = { get: () => { try { return localStorage.getItem("skp-admin-pass") || ""; } catch { return ""; } },
                  set: v => { try { v ? localStorage.setItem("skp-admin-pass", v) : localStorage.removeItem("skp-admin-pass"); } catch {} } };
  const login = msg => {
    root.innerHTML = `<form class="login" id="lf"><h1>Dashboard</h1><p class="muted" style="margin:0">${msg}</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Passcode" required><button class="main">Open</button></form>`;
    $("lf").onsubmit = e => { e.preventDefault(); saved.set($("pw").value.trim()); location.reload(); };
    $("pw").focus();
  };
  const PASS = saved.get();
  if (!PASS) return login("Enter your dashboard passcode");
  let BOT = "";
  try { BOT = ((await (await fetch("/data/site.json", { cache: "no-cache" })).json()).site || {}).reportApi || ""; } catch {}
  if (!BOT) { root.innerHTML = `<p class="empty">Couldn't find the bot's address (data/site.json → reportApi).</p>`; return; }

  let D = null;
  async function api(op, extra = {}) {
    const r = await fetch(BOT + "/admin/api", { method: "POST", headers: { "Content-Type": "application/json", "X-Passcode": PASS }, body: JSON.stringify({ op, ...extra }) });
    const j = await r.json().catch(() => ({ error: "No answer from the bot" }));
    if (r.status === 401) { saved.set(""); login(j.error === "no passcode set" ? "No passcode set yet — run <code>npx wrangler secret put ADMIN_PASSCODE</code> in bot/" : "Wrong passcode — try again"); throw new Error("login"); }
    if (!r.ok || j.error) { toast("⚠ " + (j.error || "Something went wrong")); throw new Error(j.error); }
    if (j.products) { D = j; sortData(); }
    return j;
  }
  // newest first: deals by the latest thing that happened, products + reels by when they were added
  const lastDate = e => [e.created, e.dispatched_on, e.received_on, e.draft_on, e.live_on, e.collab_on, e.paid_on].map(v => String(v || "").slice(0, 10)).filter(Boolean).sort().pop() || "";
  function sortData() {
    D.enquiries.sort((a, b) => lastDate(b).localeCompare(lastDate(a)) || b.id - a.id);
    D.products.sort((a, b) => b.id - a.id);
    D.reels.sort((a, b) => (+b.id || 0) - (+a.id || 0));
  }
  // run a save: disables the button while it works, then re-renders
  async function act(btn, fn, done) {
    if (btn) btn.disabled = true;
    try { await fn(); if (done) toast(done); render(); } catch (e) { if (btn) btn.disabled = false; }
  }

  // ---------- helpers on the data
  const STATUS = { new: "New", hold: "On hold", confirmed: "Confirmed", product: "Product added", live: "Ongoing", delivered: "Delivered", declined: "Declined" };
  const FLOW = ["new", "confirmed", "product", "live", "delivered"];
  const today = () => new Date().toLocaleDateString("en-CA");   // YYYY-MM-DD in your time zone
  // date + time, in your time zone: "YYYY-MM-DDTHH:MM" (what the date-and-time boxes use)
  const nowLocal = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); };
  const hasTime = v => /T\d\d:\d\d/.test(String(v || ""));
  // anything with a date → a moment in time: a plain date counts as midday, a logged time (UTC) as itself
  const ms = v => { v = String(v || ""); if (!v) return 0; return new Date(v.length === 10 ? v + "T12:00:00" : /Z$|[+-]\d\d:\d\d$/.test(v) ? v : v.length === 16 ? v + ":00" : v).getTime(); };
  const timeOf = v => hasTime(v) ? new Date(ms(v)).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }) : "";
  const dtVal = v => !v ? "" : String(v).length === 10 ? v + "T12:00" : String(v).slice(0, 16);   // old date-only values show as midday
  const pill = s => `<span class="pill s-${esc(s)}">${esc(STATUS[s] || s)}</span>`;
  const img = u => !u ? "" : /^https?:/.test(u) ? u : "/" + String(u).replace(/^\//, "");
  const codeOf = r => ((r.reel || "").match(/\/(?:reel|reels|p|tv)\/([A-Za-z0-9_-]+)/) || [])[1] || "";
  const flatCats = () => (D.categories || []).flatMap(c => [{ id: c.id, name: c.name }, ...(c.sub || []).map(s => ({ id: s.id, name: `${c.name} › ${s.name}` }))]);
  const catName = id => (flatCats().find(c => c.id === id) || { name: id }).name.split(" › ").pop();
  const prod = id => D.products.find(p => p.id === +id);
  const reelsOf = id => D.reels.filter(r => (r.products || []).includes(+id));
  // the brand's record (page number, Instagram, website) — products link to it, deals match it by name
  const brandRec = name => { const k = String(name || "").trim().toLowerCase(); const e = Object.entries(D.brands || {}).find(([, b]) => b.name.toLowerCase() === k); return e ? { slug: e[0], ...e[1] } : null; };
  const brandLink = name => { const b = Object.values(D.brands || {}).find(b => b.name.toLowerCase() === String(name || "").trim().toLowerCase()); return b ? b.link : ""; };
  const date = s => s ? new Date(s).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "";
  // who started it: "brand" = they reached out to us, "us" = we reached out (older ones came from the website form)
  const SOURCES = { brand: "They reached out", us: "We reached out" };
  const srcOf = e => e.source === "us" ? "us" : "brand";
  // deal type: Collab (a reel on our page) or UGC (videos for the brand's own page)
  const typeOf = e => e.deal_type === "ugc" || (!e.deal_type && /^UGC/i.test(e.package || "")) ? "ugc" : "collab";
  const TYPES = { collab: "🎬 Collab", ugc: "📹 UGC" };
  const typeBadge = e => typeOf(e) === "ugc" ? `<span class="pill" style="background:#e8f0fe;color:#1a4fa3">UGC</span> ` : "";
  const typeSelect = cur => `<label>Deal type<select name="deal_type">${Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${k === cur ? "selected" : ""}>${t}</option>`).join("")}</select></label>`;

  // ---- Brands
  // a brand's money: paid deals (agreed price) and barter deals (product worth); declined ones don't count
  function brandMoney(b) {
    const live = b.enquiries.filter(e => e.status !== "declined");
    const paidL = live.filter(e => e.payment !== "Barter" && price(e) > 0), barterL = live.filter(e => e.payment === "Barter" && e.return_product !== "1");
    return { paid: paidL.reduce((t, e) => t + price(e), 0), paidN: paidL.length, barter: barterL.reduce((t, e) => t + money(e.product_value), 0), barterN: barterL.length,
      pending: paidL.filter(e => !e.paid_on).reduce((t, e) => t + price(e), 0) };
  }
  function brandList() {
    const map = new Map();
    const add = (name, k, x) => { const key = String(name || "").trim().toLowerCase(); if (!key) return; if (!map.has(key)) map.set(key, { name: String(name).trim(), products: [], enquiries: [] }); map.get(key)[k].push(x); };
    D.products.forEach(p => add(p.brand, "products", p));
    D.enquiries.forEach(e => add(e.brand, "enquiries", e));
    const latest = b => [...b.enquiries.map(lastDate), ...b.products.map(p => String(p.id).padStart(8, "0"))].sort().pop() || "";
    const lastDeal = b => b.enquiries.map(lastDate).sort().pop() || "";
    return [...map.values()].sort((a, b) => lastDeal(b).localeCompare(lastDeal(a)) || Math.max(0, ...b.products.map(p => p.id)) - Math.max(0, ...a.products.map(p => p.id)));
  }
  // ---- Money: what came in (money on its Payment received date, products on their Product received date) + what's still due
  // ---- Content ideas for @shubhkaprateek: jot them down the moment you get them
  const ITYPE = { gadget: "🔌 Gadget", emotion: "💖 Emotion", us: "👫 More about us", "": "— No type" };
  const typeSel = (cur, css = "") => `<select name="type" style="${css}">${Object.entries(ITYPE).map(([k, t]) => `<option value="${k}" ${k === (cur || "") ? "selected" : ""}>${t}</option>`).join("")}</select>`;
  const ISTAT = { idea: "💡 Idea", planned: "📝 Planned", shot: "🎬 Shot", posted: "✅ Posted", dropped: "🗑 Dropped" };
  function vIdeas() {
    const all = D.ideas || [], open = i => ["idea", "planned", "shot"].includes(i.status);
    const inF = i => (ideaFilter === "open" ? open(i) : ideaFilter === "all" || i.status === ideaFilter) 
      && (ideaType === "all" || (i.type || "") === ideaType)
      && (!q || (i.text + " " + (i.notes || "")).toLowerCase().includes(q));
    const list = all.filter(inF), cnt = f => all.filter(i => f === "open" ? open(i) : f === "all" || i.status === f).length;
    const row = i => ideaEdit === i.id ? `<form class="card idea-edit" data-ideaform="${i.id}" style="display:grid;gap:10px">
        <textarea name="text" rows="3" required>${esc(i.text)}</textarea>
        <div class="grid2"><label>Type${typeSel(i.type)}</label><label>Status<select name="status">${Object.entries(ISTAT).map(([k, t]) => `<option value="${k}" ${k === i.status ? "selected" : ""}>${t}</option>`).join("")}</select></label></div>
        <label>Link <span class="muted small" style="font-weight:500">(inspiration reel, audio, the posted reel…)</span><input name="link" value="${esc(i.link)}" placeholder="https://…"></label>
        <label>Notes <span class="muted small" style="font-weight:500">(hook, script, props, where to shoot)</span><textarea name="notes" rows="4">${esc(i.notes)}</textarea></label>
        <div class="row"><button class="main" type="submit">Save</button><button type="button" data-ideacancel>Cancel</button><button type="button" data-ideadel="${i.id}" style="margin-left:auto">Delete</button></div></form>`
      : `<div class="item idea-row" style="cursor:default;align-items:flex-start"><span style="flex:1;min-width:0"><span style="white-space:pre-wrap">${esc(i.text)}</span><br>
        <span class="muted small">${date(i.created)}${i.link ? ` · <a href="${esc(i.link)}" target="_blank" rel="noopener">link ↗</a>` : ""}${i.notes ? " · 📝 notes" : ""}</span></span>
        <span class="row" style="gap:6px;flex-wrap:wrap"><select data-ideatype="${i.id}" aria-label="Type" style="width:auto">${Object.entries(ITYPE).map(([k, t]) => `<option value="${k}" ${k === (i.type || "") ? "selected" : ""}>${t}</option>`).join("")}</select><select data-ideastat="${i.id}" aria-label="Status" style="width:auto">${Object.entries(ISTAT).map(([k, t]) => `<option value="${k}" ${k === i.status ? "selected" : ""}>${t}</option>`).join("")}</select><button type="button" data-ideaedit="${i.id}">Edit</button></span></div>`;
    return `<div class="between"><h1>Content ideas</h1><input id="q" placeholder="Search ideas…" value="${esc(q)}" style="width:220px"></div>
      <form id="ideaadd" class="card" style="display:grid;gap:10px"><textarea name="text" rows="2" placeholder="Got an idea? Write it down… (⌘/Ctrl + Enter to save)" required></textarea>
        <div class="row" style="align-items:center">${typeSel("", "width:auto")}<input name="link" placeholder="Link (optional)" style="flex:1;min-width:160px"><button class="main" type="submit">+ Add idea</button></div></form>
      <div class="row">${[["open", "Open"], ...Object.entries(ISTAT), ["all", "All"]].map(([k, t]) => `<button class="chip ${ideaFilter === k ? "on" : ""}" data-ifilter="${k}">${t} ${cnt(k)}</button>`).join("")}</div>
      <div class="row">${[["all", "All types"], ...Object.entries(ITYPE).filter(([k]) => k)].map(([k, t]) => `<button class="chip ${ideaType === k ? "on" : ""}" data-itype="${k}">${t}</button>`).join("")}</div>
      <div class="list">${list.map(row).join("") || `<p class="empty">${all.length ? "No ideas here." : "No ideas yet — the next one you get, put it here."}</p>`}</div>`;
  }

  function vMoney() {
    const rs = n => "₹" + Math.round(n).toLocaleString("en-IN"), now = today();
    const short = n => n >= 1e5 ? "₹" + (n / 1e5).toFixed(n % 1e5 ? 1 : 0) + "L" : n >= 1000 ? "₹" + (n / 1000).toFixed(n % 1000 ? 1 : 0) + "k" : "₹" + Math.round(n);
    const day = v => String(v || "").slice(0, 10);
    const agreed = D.enquiries.filter(e => AGREED.includes(e.status) && (moneyType === "all" || typeOf(e) === moneyType));
    const cash = agreed.filter(e => price(e) > 0);                        // any deal with an agreed amount (barter + extra payment counts too)
    // tentative = the reel isn't out yet: confirmed, or ongoing without a "Reel went live" date — once it's live (or delivered) the money is due
    const isTent = e => ["confirmed", "product"].includes(e.status) || (e.status === "live" && !e.live_on && e.pitched !== "1");
    const got = cash.filter(e => e.paid_on), unpaid = cash.filter(e => !e.paid_on), due = unpaid.filter(e => !isTent(e));
    const late = unpaid.filter(e => e.payment_due && e.payment_due < now);
    // a product counts the day it became yours for free: Product received — or, for a reel pitched after you bought the product, the day they paid you back
    // (a product that's still on its way doesn't count yet)
    const pday = e => day(e.pitched === "1" ? (e.paid_on || e.collab_on || e.created) : (e.received_on || e.live_on || e.collab_on || e.paid_on));
    const prods = agreed.filter(e => money(e.product_value) > 0 && pday(e) && e.return_product !== "1");   // a product that goes back to the brand isn't ours
    const toReturn = agreed.filter(e => e.return_product === "1" && !e.returned_on);
    // 🔮 incoming (tentative): deals whose reel isn't out yet — their unpaid amount + the product that's still to arrive
    const tent = agreed.filter(isTent).map(e => ({ e, c: e.paid_on ? 0 : price(e), p: e.return_product !== "1" && !pday(e) ? money(e.product_value) : 0 })).filter(x => x.c + x.p > 0);
    const tentC = tent.reduce((t, x) => t + x.c, 0), tentP = tent.reduce((t, x) => t + x.p, 0);
    const tentRow = ({ e, c, p }) => `<button class="item" data-open="${e.id}"><span><b>${esc(e.brand)}</b> <span class="muted small">· ${esc(e.package || "—")}</span><br>
        <span class="muted small">${[pill(e.status), c ? "💸 " + rs(c) + (guessed(e) ? " (package price — no Agreed price set)" : "") : "", p ? "🎁 " + rs(p) + (e.dispatched_on ? " · on its way" : "") : "", e.post_by ? "post by " + dateY(e.post_by) : ""].filter(Boolean).join(" · ")}</span></span><b>${rs(c + p)}</b></button>`;
    // the range
    const first = [...got.map(e => e.paid_on), ...prods.map(pday)].filter(Boolean).sort()[0] || now;
    const back = n => new Date(Date.now() - n * 864e5).toLocaleDateString("en-CA");
    const [from, to] = moneyRange === "all" ? [first, now] : moneyRange === "month" ? [now.slice(0, 8) + "01", now]
      : moneyRange === "custom" ? [moneyFrom || first, moneyTo || now] : [back(29), now];
    const inR = d => d >= from && d <= to;
    // every earning as one line: money or a product
    const items = [...got.map(e => ({ d: day(e.paid_on), kind: "cash", v: price(e), e })), ...prods.map(e => ({ d: pday(e), kind: "prod", v: money(e.product_value), e }))].filter(x => inR(x.d));
    const tot = k => items.filter(x => !k || x.kind === k).reduce((t, x) => t + x.v, 0);
    const allTime = got.reduce((t, e) => t + price(e), 0) + prods.reduce((t, e) => t + money(e.product_value), 0);
    // the graph follows the range: days up to ~2 months, then weeks, then months
    const span = Math.round((new Date(to) - new Date(from)) / 864e5) + 1;
    const unit = span <= 62 ? "day" : span <= 190 ? "week" : "month";
    const bucketOf = d => { if (unit === "day") return d; if (unit === "month") return d.slice(0, 7);
      const t = new Date(d + "T12:00:00"); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return t.toLocaleDateString("en-CA"); };
    const buckets = []; for (let t = new Date(from + "T12:00:00"); t.toLocaleDateString("en-CA") <= to; t.setDate(t.getDate() + 1)) { const b = bucketOf(t.toLocaleDateString("en-CA")); if (buckets[buckets.length - 1] !== b) buckets.push(b); }
    const val = (b, k) => items.filter(x => bucketOf(x.d) === b && x.kind === k).reduce((t, x) => t + x.v, 0);
    const top = Math.max(1, ...buckets.map(b => val(b, "cash") + val(b, "prod")));
    // one part of a bar (products on top, money below); its amount shows inside when there's room
    const wide = buckets.length <= 14;
    // inner amounts only when a bar has both parts (the total is already on top); a thin part gets just enough height for its number
    const seg = (v, t, k) => { if (!v) return ""; const both = v !== t, px = (t / top) * 0.82 * 170 * (v / t);
      return `<i style="flex:${v};${both && wide && px < 16 ? "min-height:16px;" : ""}" class="${k}">${both && wide ? `<b>${short(v)}</b>` : ""}</i>`; };
    const bLabel = b => unit === "month" ? new Date(b + "-01T12:00:00").toLocaleDateString("en-IN", { month: "short", year: "2-digit" }) : unit === "week" ? "week of " + date(b) : date(b);
    // day by day
    const byDay = {}; items.forEach(x => (byDay[x.d] = byDay[x.d] || []).push(x));
    const days = Object.keys(byDay).sort().reverse();
    const lbl = moneyRange === "all" ? "all time" : moneyRange === "month" ? "this month" : moneyRange === "custom" ? `${dateY(from)} – ${dateY(to)}` : "last 30 days";
    const dueRow = e => `<button class="item" data-open="${e.id}"><span><b>${esc(e.brand)}</b> <span class="muted small">· ${esc(e.package || "—")}</span><br>
        <span class="small ${e.payment_due && e.payment_due < now ? "" : "muted"}" style="${e.payment_due && e.payment_due < now ? "color:#9b2c2c;font-weight:600" : ""}">${e.payment_due ? (e.payment_due < now ? "Late — was due " : "Due ") + dateY(e.payment_due) : "No deadline set"}${guessed(e) ? " · package price — no Agreed price set" : ""}</span></span><b>${rs(price(e))}</b></button>`;
    return `<div class="between"><h1>Earnings</h1><div class="row">${[["30", "Last 30 days"], ["month", "This month"], ["all", "All time"], ["custom", "Custom"]].map(([k, t]) => `<button class="chip ${moneyRange === k ? "on" : ""}" data-mrange="${k}">${t}</button>`).join("")}</div></div>
      ${moneyRange === "custom" ? `<div class="row" style="align-items:end"><label class="small">From<input type="date" id="mfrom" value="${esc(from)}" max="${esc(now)}"></label><label class="small">To<input type="date" id="mto" value="${esc(to)}" max="${esc(now)}"></label></div>` : ""}
      ${typeChips(moneyType, "data-mtype")}
      <div class="stats4">
        <div class="stat big"><b>${rs(tot())}</b><span>Total earned · ${esc(lbl)} (money + products)${moneyType === "all" && items.some(x => typeOf(x.e) === "ugc") ? `<br>🎬 Collab ${rs(items.filter(x => typeOf(x.e) === "collab").reduce((t, x) => t + x.v, 0))} · 📹 UGC ${rs(items.filter(x => typeOf(x.e) === "ugc").reduce((t, x) => t + x.v, 0))}` : ""}</span></div>
        <div class="stat"><b>${rs(tot("cash"))}</b><span>💸 Money received · ${items.filter(x => x.kind === "cash").length}</span></div>
        <div class="stat"><b>${rs(tot("prod"))}</b><span>🎁 Products worth · ${items.filter(x => x.kind === "prod").length}</span></div>
        <div class="stat ${late.length ? "warn" : ""}"><b>${rs(due.reduce((t, e) => t + price(e), 0))}</b><span>Still due now · ${due.length} deal${due.length === 1 ? "" : "s"}${late.length ? ` · ⚠️ ${rs(late.reduce((t, e) => t + price(e), 0))} late` : ""}</span></div>
        <div class="stat"><b>${rs(tentC + tentP)}</b><span>🔮 Incoming (tentative) · ${tent.length} deal${tent.length === 1 ? "" : "s"}${tentP ? ` · 💸 ${rs(tentC)} + 🎁 ${rs(tentP)}` : ""}</span></div>
        <div class="stat"><b>${rs(allTime)}</b><span>Earned all time (money + products)</span></div>
      </div>
      <section class="card"><h2>Earned per ${unit} <span class="muted small" style="font-weight:500">· ${esc(lbl)} · <span style="color:var(--accent)">■</span> money <span style="color:#d4a62a">■</span> products</span></h2>
        <div class="bars" role="img" aria-label="Earned per ${unit}, ${esc(lbl)}">${buckets.map(b => { const c = val(b, "cash"), pr = val(b, "prod"), t = c + pr;
          return `<span class="col" title="${esc(bLabel(b))}: ${rs(t)}${t ? ` (money ${rs(c)} · products ${rs(pr)})` : ""}">${t ? `<em>${short(t)}</em>` : ""}<span class="bar" style="height:${t ? Math.max(4, t / top * 82) : 1.5}%">${t ? seg(pr, t, "p") + seg(c, t, "c") : `<i class="z"></i>`}</span></span>`; }).join("")}</div>
        ${buckets.length <= 14 ? `<div class="xlab">${buckets.map((b, i) => `<span>${esc(unit === "day" ? date(b).split(" ")[0] : unit === "month" ? new Date(b + "-01T12:00:00").toLocaleDateString("en-IN", { month: "short" }) : bLabel(b).replace("week of ", ""))}${unit === "month" && (i === 0 || b.endsWith("-01")) ? `<span class="yr"> '${b.slice(2, 4)}</span>` : ""}</span>`).join("")}</div>`
          : `<div class="between small muted" style="margin-top:4px"><span>${esc(bLabel(buckets[0]))}</span><span>${esc(bLabel(buckets[buckets.length - 1]))}</span></div>`}
        ${unit !== "day" ? `<div class="row small" style="margin-top:10px">${buckets.filter(b => val(b, "cash") + val(b, "prod")).reverse().map(b => `<span class="chip" style="cursor:default">${esc(bLabel(b))}: <b>${rs(val(b, "cash") + val(b, "prod"))}</b>${val(b, "prod") ? ` · 🎁 ${rs(val(b, "prod"))}` : ""}${val(b, "cash") ? ` · 💸 ${rs(val(b, "cash"))}` : ""}</span>`).join("")}</div>` : ""}</section>
      <div class="split">
        <section class="card"><h2>Day by day</h2>
          ${days.map(d => `<div style="padding:8px 0;border-bottom:1px dashed var(--line)"><div class="between"><b>${dateY(d)}</b><b>${rs(byDay[d].reduce((t, x) => t + x.v, 0))}</b></div>
            ${byDay[d].map(x => `<div class="between small" style="cursor:pointer" data-open="${x.e.id}"><span class="muted">${x.kind === "cash" ? "💸" : "🎁"} ${esc(x.e.brand)}${typeOf(x.e) === "ugc" ? " · UGC" : ""}${x.kind === "cash" && x.e.txn_id ? " · " + esc(x.e.txn_id) : ""}${x.kind === "prod" && x.e.payment === "Barter" ? " · barter" : ""}</span><span>${rs(x.v)}</span></div>`).join("")}</div>`).join("") || `<p class="muted" style="margin:0">Nothing in this range. Money counts on its <b>Payment received</b> date; a product on its <b>Product received</b> date.</p>`}</section>
        ${toReturn.length ? `<section class="card"><h2>↩ Products to send back <span class="muted small" style="font-weight:500">· ${toReturn.length}</span></h2><div class="list">${toReturn.map(e => `<button class="item" data-open="${e.id}"><span><b>${esc(e.brand)}</b> <span class="muted small">· ${esc(e.package || "—")}</span><br><span class="muted small">${e.product_value ? esc(e.product_value) + " · " : ""}not counted in Earnings</span></span>${pill(e.status)}</button>`).join("")}</div></section>` : ""}
        <section class="card"><h2>🔮 Incoming <span class="muted small" style="font-weight:500">· tentative · confirmed + ongoing, reel not live yet</span></h2><div class="list">${tent.sort((a, b) => (a.e.post_by || "9999").localeCompare(b.e.post_by || "9999")).map(tentRow).join("") || `<p class="muted" style="margin:0">Nothing in the pipeline.</p>`}</div></section>
        <section class="card"><h2>Still due <span class="muted small" style="font-weight:500">· reel is live, not paid</span></h2><div class="list">${due.sort((a, b) => (a.payment_due || "9999").localeCompare(b.payment_due || "9999")).map(dueRow).join("") || `<p class="muted" style="margin:0">Nothing due 🎉</p>`}</div></section>
      </div>
      <p class="muted small" style="margin:0">Counts confirmed, ongoing and delivered deals. 🔮 Incoming = Confirmed and Ongoing deals whose reel isn't live yet: their unpaid price + the product still to arrive. When the product arrives it counts as earned; when you set "Reel went live" (or mark Delivered) the money moves to Still due. Money = Agreed price, counted on its Payment received date (until then it's due). Products = Product value (not ones that go back to the brand), counted on Product received (or the reel's live date if that's empty); for an after-live pitch, on the day they paid.</p>`;
  }

  // ---- Categories: tab → sub-category → products
  function vCategories() {
    const has = (p, id) => (p.category || []).includes(id);
    const match = p => !q || (p.name + " " + (p.brand || "")).toLowerCase().includes(q);
    const leaf = p => `<div class="leaf"><img class="thumb" onerror="this.style.visibility='hidden'" src="${esc(img(p.variants[0]?.image))}" alt="" referrerpolicy="no-referrer"><b>${esc(p.name)}</b><span class="muted small">${esc(p.brand || "")}</span><button data-editp="${p.id}">Edit</button></div>`;
    const none = `<p class="muted small" style="margin:0;padding:6px 14px 10px 40px">No products yet</p>`;
    const tree = (D.categories || []).map(c => {
      const subs = c.sub || [], ids = [c.id, ...subs.map(x => x.id)];
      const all = D.products.filter(p => ids.some(id => has(p, id)) && match(p));
      const direct = all.filter(p => !subs.some(x => has(p, x.id)));   // in the tab but in none of its sub-categories
      if (q && !all.length) return "";
      return `<details ${q ? "open" : ""}><summary><b>${esc(c.emoji || "")} ${esc(c.name)}</b>${c.theme ? `<span class="muted small">theme</span>` : ""}<span class="n">${all.length}</span><span class="cbtns"><button type="button" class="small" data-catedit="${esc(c.id)}">Edit</button><button type="button" class="small" data-catadd="${esc(c.id)}">+ Sub</button></span></summary>
        ${subs.map(x => { const ps = all.filter(p => has(p, x.id)); return q && !ps.length ? "" : `<details ${q ? "open" : ""}><summary>${esc(x.name)}<span class="n">${ps.length}</span><span class="cbtns"><button type="button" class="small" data-catedit="${esc(x.id)}">Edit</button></span></summary>${ps.map(leaf).join("") || none}</details>`; }).join("")}
        ${direct.length ? (subs.length ? `<details ${q ? "open" : ""}><summary class="muted">No sub-category<span class="n">${direct.length}</span></summary>${direct.map(leaf).join("")}</details>` : direct.map(leaf).join("")) : (!subs.length ? none : "")}
      </details>`;
    }).join("");
    const known = new Set(flatCats().map(c => c.id));
    const orphans = D.products.filter(p => !(p.category || []).some(id => known.has(id)) && match(p));
    return `<div class="between"><h1>Categories</h1><div class="row"><input id="q" placeholder="Search products…" value="${esc(q)}" style="width:240px"><button class="main" data-catadd="">+ Add category</button></div></div>
      <p class="muted" style="margin:0">Tap a category to open it. <b>Edit</b> renames it, changes its keywords or deletes it; <b>+ Sub</b> adds a sub-category. Change a product's categories from its Edit.</p>
      <div class="tree" style="display:grid;gap:10px">${tree || `<p class="empty">Nothing matches.</p>`}
      ${orphans.length ? `<details open><summary><b>⚠️ Not in any category</b><span class="n">${orphans.length}</span></summary>${orphans.map(leaf).join("")}</details>` : ""}</div>`;
  }

  function vBrands() {
    const list = brandList().filter(b => !q || b.name.toLowerCase().includes(q));
    return `<div class="between"><h1>Brands <span class="muted" style="font:500 16px Inter,sans-serif">${list.length}</span></h1><input id="q" placeholder="Search brands…" value="${esc(q)}" style="width:220px"></div>
      <div class="tablebox"><table class="table"><thead><tr><th>Brand</th><th>Collabs</th><th>Products</th><th>Paid deals</th><th>Barter deals</th><th>Brand page</th></tr></thead><tbody>
      ${list.map(b => `<tr style="cursor:pointer" data-brand="${esc(b.name)}"><td><b>${esc(b.name)}</b></td><td>${b.enquiries.length}</td><td>${b.products.length}</td>
        ${(m => `<td>${m.paidN ? `₹${m.paid.toLocaleString("en-IN")} <span class="muted small">· ${m.paidN}</span>` : `<span class="muted small">—</span>`}</td><td>${m.barterN ? `₹${m.barter.toLocaleString("en-IN")} <span class="muted small">· ${m.barterN}</span>` : `<span class="muted small">—</span>`}</td>`)(brandMoney(b))}
        <td>${brandLink(b.name) ? `<a href="${esc(brandLink(b.name))}" target="_blank" rel="noopener">${esc(brandLink(b.name).replace(/^https:\/\//, ""))}</a>` : `<span class="muted small">after first product</span>`}</td></tr>`).join("")}
      </tbody></table></div>`;
  }
  function vBrand() {
    const b = brandList().find(x => x.name.toLowerCase() === String(openId || "").toLowerCase());
    if (!b) return `<p class="empty">Brand not found. <a href="#brands" data-go="brands">Back</a></p>`;
    const m = brandMoney(b);
    const reels = [...new Set(b.products.flatMap(p => reelsOf(p.id)))];
    return `<a href="#brands" data-go="brands" class="small" style="font-weight:600;text-decoration:none">← Brands</a>
      <div class="between"><h1>${esc(b.name)}</h1><span class="row">${brandRec(b.name) ? `<button data-brandedit="${esc(brandRec(b.name).slug)}">Edit brand</button>` : ""}${brandLink(b.name) ? `<a class="btn main" href="${esc(brandLink(b.name))}" target="_blank" rel="noopener">Their brand page ↗</a>` : ""}</span></div>
      <div class="grid2">
        <div class="card"><b style="font:700 26px Fraunces,serif">${b.enquiries.length}</b><br><span class="muted small">Collabs / enquiries</span></div>
        <div class="card"><b style="font:700 26px Fraunces,serif">₹${m.paid.toLocaleString("en-IN")}</b><br><span class="muted small">Paid deals · ${m.paidN}${m.pending ? ` · ₹${m.pending.toLocaleString("en-IN")} not received yet` : ""}</span></div>
        <div class="card"><b style="font:700 26px Fraunces,serif">₹${m.barter.toLocaleString("en-IN")}</b><br><span class="muted small">Barter deals · ${m.barterN} (product worth)</span></div>
        <div class="card"><b style="font:700 26px Fraunces,serif">${b.products.length}</b><br><span class="muted small">Products · ${reels.length} reel${reels.length === 1 ? "" : "s"}</span></div>

      { const e0 = D.enquiries.find(x => x.id === +openId) || {};   // an old date-only value you didn't touch stays date-only (no made-up 12:00)

        ${cur ? `<button type="button" class="danger" data-del style="margin-left:auto">Delete${used ? ` (used by ${used} product${used === 1 ? "" : "s"})` : ""}</button>` : ""}</div>
      ${cur && isTop && (top.sub || []).length ? `<p class="muted small" style="margin:0">Deleting this also deletes its ${top.sub.length} sub-categories.</p>` : ""}
      ${cur && used ? `<p class="muted small" style="margin:0">Deleting takes it off those products — they keep their other categories.</p>` : ""}</form>`;
    document.body.appendChild(dlg);
    const f = dlg.querySelector("form"), close = () => { dlg.close(); dlg.remove(); };
    dlg.querySelectorAll("[data-x]").forEach(x => x.onclick = close); dlg.addEventListener("cancel", close);
    const send = async (btn, next, msg) => { btn.disabled = true; try { await api("categories.save", { categories: next }); close(); toast(msg); render(); } catch { btn.disabled = false; } };
    f.onsubmit = ev => { ev.preventDefault();
      const name = f.name.value.trim(); if (!name) return f.name.focus();
      const kw = f.keywords.value.split(/[,\n]+/).map(k => k.trim()).filter(Boolean);
      if (cur) { cur.name = name; cur.keywords = kw; if (isTop) { cur.emoji = f.emoji.value.trim(); cur.theme = f.theme.checked; } }
      else { const id = name.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        if (flatCats().some(c => c.id === id)) { toast("There's already a category called that"); return f.name.focus(); }
        const c = { id, name, keywords: kw };
        if (isTop) { if (f.emoji.value.trim()) c.emoji = f.emoji.value.trim(); if (f.theme.checked) c.theme = true; tree.push(c); }
        else (under.sub = under.sub || []).push(c); }
      send(f.querySelector("button.main"), tree, cur ? "Category saved — on the website in a few seconds" : "Category added — on the website in a few seconds"); };
    const del = f.querySelector("[data-del]");
    if (del) del.onclick = () => { if (!confirmTwice(del)) return;
      const next = isTop ? tree.filter(c => c.id !== cur.id) : tree.map(c => c === parent ? { ...c, sub: c.sub.filter(x => x.id !== cur.id) } : c);
      send(del, next, "Category deleted"); };
    dlg.showModal(); f.name.focus();
  }
  // destructive buttons need a second tap
  function confirmTwice(b) { if (b.dataset.sure) return true; b.dataset.sure = "1"; const t = b.textContent; b.textContent = "Tap again to confirm"; setTimeout(() => { delete b.dataset.sure; b.textContent = t; }, 3000); return false; }
  // phone photos are big: shrink to 1200 px JPEG before uploading
  function shrink(file) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => { const s = Math.min(1, 1200 / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", .85)); URL.revokeObjectURL(im.src); }; im.onerror = no; im.src = URL.createObjectURL(file); }); }

  root.innerHTML = `<p class="empty">Loading…</p>`;
  try { await api("load"); } catch (e) { if (e.message !== "login") root.innerHTML = `<p class="empty">Couldn't load the dashboard — reload in a minute.</p>`; return; }
  const [v, id] = location.hash.slice(1).split("/"); if (v) { view = v; openId = id ? decodeURIComponent(id) : null; }
  render();
})();
</script>
</body>
</html>
