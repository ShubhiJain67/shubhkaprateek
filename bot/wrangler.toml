# Cloudflare Worker settings for the Telegram bot. setup.sh fills in the KV id.
name = "shubhkaprateek-bot"
main = "worker.js"
# the Cloudflare account the bot lives on (jainshubhi67@gmail.com) — deploys always go here
account_id = "02444c1df471cf35375ccc29d2ee0be0"
compatibility_date = "2025-06-01"

[[kv_namespaces]]
binding = "DRAFTS"
id = "cc3ed0c7ca624ba3a93a9ecdef1bba4a"

[vars]
GITHUB_REPO = "ShubhiJain67/shubhkaprateek"
GITHUB_BRANCH = "main"
SITE_URL = "https://shubhkaprateek.com"

# free click counter for the brand pages (bot/report.js → hits table)
[[d1_databases]]
binding = "STATS"
database_name = "skp-stats"
database_id = "751c2e42-6da7-4340-b1c8-df8866bcbd59"
