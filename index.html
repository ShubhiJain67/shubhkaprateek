<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shubh ka Prateek — Shop our reels</title>
<meta name="description" content="Every product from @shubhkaprateek reels, in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf6f1;
    --surface: #ffffff;
    --ink: #2b1f1a;
    --muted: #7a6a62;
    --line: #eadfd6;
    --accent: #d9534f;
    --accent-ink: #ffffff;
    --chip: #f3e8df;
    --shadow: 0 1px 2px rgba(43,31,26,.06), 0 8px 24px rgba(43,31,26,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1513; --surface: #241d1a; --ink: #f5ece6; --muted: #b3a39a;
      --line: #3a2f2a; --accent: #ef7a6f; --accent-ink: #1a1513; --chip: #2f2622;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  header { padding: 36px 0 16px; text-align: center; }
  h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 700;
    font-size: clamp(30px, 7vw, 44px); letter-spacing: -0.02em; margin: 0 0 6px;
  }
  .tagline { color: var(--muted); margin: 0 0 12px; }
  .ig { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 14px; }
  .ig:hover { text-decoration: underline; }

  .controls {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 0 10px; border-bottom: 1px solid var(--line);
  }
  .search {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink); font: inherit; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 0; cursor: pointer; padding: 8px 14px; border-radius: 999px;
    background: var(--chip); color: var(--ink); font: inherit; font-size: 14px; font-weight: 500;
    white-space: nowrap;
  }
  .chip .n { color: var(--muted); margin-left: 4px; font-size: 12px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }

  .feed {
    display: grid; gap: 22px; padding: 20px 0 24px;
    grid-template-columns: 1fr;
    justify-items: center;
  }
  @media (min-width: 760px)  { .feed { grid-template-columns: repeat(2, 1fr); align-items: start; } }
  @media (min-width: 1120px) { .feed { grid-template-columns: repeat(3, 1fr); } }

  .post {
    width: 100%; max-width: 380px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .post-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
  .num {
    background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px;
  }
  .post-title { font-weight: 600; font-size: 14px; margin: 0; flex: 1; min-width: 0; }
  .cat { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .reel { padding: 0 10px; }
  /* Instagram's embed sets its own inline styles; keep it inside the card */
  .reel .instagram-media, .reel iframe {
    min-width: 0 !important; width: 100% !important; max-width: 100% !important;
    margin: 0 !important; border-radius: 12px !important;
  }
  .reel-missing {
    aspect-ratio: 9 / 16; max-height: 420px; width: 100%;
    border-radius: 12px; border: 2px dashed var(--line);
    display: grid; place-items: center; text-align: center;
    color: var(--muted); font-size: 13px; padding: 16px;
  }

  .products { list-style: none; margin: 0; padding: 10px 14px 14px; display: grid; gap: 8px; }
  .products-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 12px 14px 0; }
  .prod {
    display: flex; align-items: center; gap: 10px;
    padding: 8px; border: 1px solid var(--line); border-radius: 12px;
    text-decoration: none; color: inherit;
  }
  .prod:hover { border-color: var(--accent); }
  .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--chip); flex: 0 0 auto; }
  .prod-info { flex: 1; min-width: 0; }
  .prod-name { font-weight: 500; font-size: 14px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prod-price { color: var(--muted); font-size: 13px; }
  .shop {
    background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px;
    padding: 7px 12px; border-radius: 10px; flex: 0 0 auto;
  }

  .more-wrap { text-align: center; padding: 0 0 36px; }
  .more {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-weight: 600; padding: 10px 22px; border-radius: 999px; cursor: pointer;
  }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 30px; }
</style>
</head>
<body>
  <header class="wrap">
    <h1 id="title">Shubh ka Prateek</h1>
    <p class="tagline" id="tagline"></p>
    <a class="ig" id="ig" href="#" target="_blank" rel="noopener" hidden>📸 Follow @shubhkaprateek</a>
  </header>

  <div class="controls">
    <div class="wrap">
      <input class="search" id="q" type="search" placeholder="Search a product, or a reel number (e.g. 12)" autocomplete="off">
      <div class="chips" id="chips" role="toolbar" aria-label="Categories"></div>
    </div>
  </div>

  <main class="wrap">
    <div class="feed" id="feed"></div>
    <p class="empty" id="empty" hidden>Nothing here yet 👀</p>
    <div class="more-wrap"><button class="more" id="more" hidden>Load more reels</button></div>
  </main>

  <footer>Some links may be affiliate links — we may earn a small commission at no extra cost to you.</footer>

<script>
(async function () {
  const PAGE = 6; // reels rendered per batch — Instagram embeds are heavy
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const $ = id => document.getElementById(id);

  let data;
  try {
    const res = await fetch("products.json", { cache: "no-cache" });
    data = await res.json();
  } catch (e) {
    $("feed").innerHTML = '<p class="empty">Couldn\'t load products.json — check it for a JSON typo (missing comma or quote).</p>';
    console.error(e);
    return;
  }

  const site = data.site || {};
  const cats = data.categories || [];
  const catById = Object.fromEntries(cats.map(c => [c.id, c]));
  const reels = (data.reels || []).slice().sort((a, b) =>
    (b.featured ? 1 : 0) - (a.featured ? 1 : 0) || (b.id ?? 0) - (a.id ?? 0)); // newest first

  if (site.title) { $("title").textContent = site.title; document.title = site.title + " — Shop our reels"; }
  if (site.tagline) $("tagline").textContent = site.tagline;
  if (site.instagram) { $("ig").href = site.instagram; $("ig").hidden = false; }

  const params = new URLSearchParams(location.search);
  let active = params.get("c") || "all";
  if (active !== "all" && !catById[active]) active = "all";
  $("q").value = params.get("q") || "";
  let shown = PAGE, filtered = [];

  // Normalise any instagram reel/post URL to a clean permalink, or null if invalid
  function permalink(url) {
    const m = String(url || "").match(/instagram\.com\/(?:[\w.]+\/)?(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/);
    if (!m || /PASTE/i.test(m[2])) return null;
    return `https://www.instagram.com/${m[1] === "reels" ? "reel" : m[1]}/${m[2]}/`;
  }

  function renderChips() {
    const counts = {};
    reels.forEach(r => counts[r.category] = (counts[r.category] || 0) + 1);
    const list = [{ id: "all", name: "All", emoji: "✨" }, ...cats.filter(c => counts[c.id])];
    $("chips").innerHTML = list.map(c => {
      const n = c.id === "all" ? reels.length : counts[c.id];
      return `<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id === active}">${esc(c.emoji || "")} ${esc(c.name)}<span class="n">${n}</span></button>`;
    }).join("");
  }

  function post(r) {
    const c = catById[r.category] || { name: r.category || "", emoji: "" };
    const url = permalink(r.reel);
    const reel = url
      ? `<blockquote class="instagram-media" data-instgrm-permalink="${esc(url)}?utm_source=ig_embed" data-instgrm-version="14"><a href="${esc(url)}" target="_blank" rel="noopener">Watch this reel on Instagram</a></blockquote>`
      : `<div class="reel-missing">Paste this reel's Instagram link<br>into products.json</div>`;
    const prods = (r.products || []).map(p => `
      <li><a class="prod" href="${esc(p.link)}" target="_blank" rel="noopener sponsored">
        ${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
        <div class="prod-info">
          <p class="prod-name">${esc(p.name)}</p>
          ${p.price ? `<span class="prod-price">${esc(p.price)}</span>` : ""}
        </div>
        <span class="shop">Shop →</span>
      </a></li>`).join("");
    return `<article class="post">
      <div class="post-head">
        ${r.id != null ? `<span class="num">#${esc(r.id)}</span>` : ""}
        <p class="post-title">${esc(r.title || "")}</p>
        <span class="cat">${esc(c.emoji || "")} ${esc(c.name)}</span>
      </div>
      <div class="reel">${reel}</div>
      ${prods ? `<div class="products-label">Shop this reel</div><ul class="products">${prods}</ul>` : ""}
    </article>`;
  }

  function loadEmbeds() {
    if (window.instgrm) { window.instgrm.Embeds.process(); return; }
    if (document.getElementById("ig-embed")) return;
    const s = document.createElement("script");
    s.id = "ig-embed"; s.async = true; s.src = "https://www.instagram.com/embed.js";
    document.body.appendChild(s); // processes all blockquotes on load
  }

  function draw() {
    $("feed").innerHTML = filtered.slice(0, shown).map(post).join("");
    $("empty").hidden = filtered.length > 0;
    $("more").hidden = shown >= filtered.length;
    loadEmbeds();
  }

  function apply() {
    const q = $("q").value.trim().toLowerCase().replace(/^#/, "");
    filtered = reels.filter(r => {
      if (active !== "all" && r.category !== active) return false;
      if (!q) return true;
      if (/^\d+$/.test(q)) return String(r.id) === q;
      const hay = [r.title, catById[r.category]?.name, ...(r.products || []).map(p => p.name)].join(" ").toLowerCase();
      return hay.includes(q);
    });
    shown = PAGE;
    draw();
    const u = new URLSearchParams();
    if (active !== "all") u.set("c", active);
    if (q) u.set("q", q);
    history.replaceState(null, "", u.toString() ? "?" + u : location.pathname);
  }

  let t;
  $("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(apply, 250); });
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    active = b.dataset.id; renderChips(); apply();
  });
  $("more").addEventListener("click", () => { shown += PAGE; draw(); });

  renderChips(); apply();
})();
</script>
</body>
</html>
